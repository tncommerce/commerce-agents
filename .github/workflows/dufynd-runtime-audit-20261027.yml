name: DUFYND One-Shot NPM Runtime Advisory Review
on:
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-runtime-audit-20261027.yml]
permissions:
  contents: read
jobs:
  read-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 36cc84c34791284e4245ab4504ae020434dca89e
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Read only dependency security audit without installs or modifications
        shell: bash
        working-directory: examples
        run: |
          set -euo pipefail
          (npm audit --omit=dev --workspace=acme-retail-storefront-web --json > /tmp/dufynd-runtime-npm-audit.json) || true
          python3 - <<'PY'
          import json,pathlib
          path=pathlib.Path('/tmp/dufynd-runtime-npm-audit.json')
          data=json.loads(path.read_text())
          vulns=data.get('vulnerabilities',{})
          output=[]
          for package,detail in sorted(vulns.items()):
              output.append({
                  'package':package,
                  'severity':detail.get('severity'),
                  'isDirect':detail.get('isDirect'),
                  'via':[v.get('name') if isinstance(v,dict) else str(v) for v in detail.get('via',[])],
                  'range':detail.get('range'),
                  'fixAvailable':detail.get('fixAvailable'),
              })
          print('DUFYND_NPM_AUDIT='+json.dumps({
              'report_ok':data.get('auditReportVersion') is not None,
              'metadata':data.get('metadata',{}).get('vulnerabilities',{}),
              'production_only':True,
              'audited_prod_commit':'36cc84c34791284e4245ab4504ae020434dca89e',
              'vulnerabilities':output,
              'no_packages_changed':True,
          }))
          if data.get('auditReportVersion') is None:
              raise SystemExit('audit_registry_or_response_error')
          PY
