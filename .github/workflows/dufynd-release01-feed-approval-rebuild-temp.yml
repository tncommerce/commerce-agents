name: DUFYND Release01 Feed Approval Rebuild TEMP

on:
  push:
    branches:
      - dufynd-release01-approve-feed-images-20261001
    paths:
      - .github/workflows/dufynd-release01-feed-approval-rebuild-temp.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dufynd-release01-approve-feed-images-20261001
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Rebuild canonical staging
        run: PYTHONPATH=. python scripts/build_scentai_catalog_staging.py
      - name: Refresh derived DUFYND status snapshots
        shell: bash
        run: |
          generated_at="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("examples/retail/data/scentai_jarvis_master_status.json")
          print(json.loads(p.read_text(encoding="utf-8"))["generated_at"])
          PY
          )"
          PYTHONPATH=. python scripts/refresh_scentai_jarvis_state.py --write --generated-at "$generated_at"
      - name: Commit deterministic outputs
        shell: bash
        run: |
          git config user.name "tncommerce"
          git config user.email "tuanaicommerce@gmail.com"
          git add \
            examples/retail/data/scentai_catalog_staging.json \
            examples/retail/data/scentai_merchant_mapping_work_queue.json \
            examples/retail/data/scentai_affiliate_activation_status.json \
            examples/retail/data/scentai_image_approval_work_queue.json \
            examples/retail/data/scentai_release_01_feed_activation_queue.json \
            examples/retail/data/scentai_release_01_gate_status.json \
            examples/retail/data/scentai_release_pipeline_status.json \
            examples/retail/data/scentai_jarvis_operations_status.json \
            examples/retail/data/scentai_content_operations_status.json \
            examples/retail/data/scentai_content_operations_status_batch02.json \
            examples/retail/data/scentai_content_operations_status_batch03.json \
            examples/retail/data/scentai_content_pipeline_status.json \
            examples/retail/data/scentai_media_generation_queue.json \
            examples/retail/data/scentai_jarvis_master_status.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "DUFYND: rebuild Release 01 state after feed image approval"
            git push origin HEAD:dufynd-release01-approve-feed-images-20261001
          fi
