name: DUFYND CI

on:
  push:
    branches: [main, scentai-mvp]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Repo consistency checks
        run: python scripts/check.py

  no-pypi-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Package names are unregistered on the public index
        # Metadata-only tripwire, checked BEFORE any resolution below: if one of
        # these names ever appears on the index, fail here — without downloading
        # or building anything a squatter uploaded.
        run: |
          for name in commerce-common shopping-agent-core shopping-agent-runtime shopping-agent-sdk merchant-agent-core merchant-agent-runtime merchant-agent-sdk; do
            if pip index versions "$name" > idx.log 2>&1; then
              echo "ALERT: $name is registered on the public index"; cat idx.log; exit 1
            fi
            grep -q "No matching distribution found" idx.log || { cat idx.log; exit 1; }
          done
      - name: Cross-package resolution fails loudly outside the editable flow
        # Sibling deps are exact dev pins that no public index carries:
        # installing a package alone must error with "No matching
        # distribution found", never resolve a same-named public package.
        # Safe to resolve here: the step above already proved the names are
        # unregistered, and --only-binary forbids building any remote sdist
        # even in the window between the two steps (local dirs still build).
        run: |
          for pkg in ./shopping-agent/core ./shopping-agent/runtime-messages-api ./shopping-agent/runtime-agent-sdk ./merchant-agent/core ./merchant-agent/runtime-messages-api ./merchant-agent/runtime-agent-sdk; do
            if pip install --dry-run --only-binary=:all: "$pkg" > out.log 2>&1; then
              echo "UNEXPECTED: $pkg resolved without sibling installs"; cat out.log; exit 1
            fi
            grep -q "No matching distribution found" out.log || { cat out.log; exit 1; }
          done

  web:
    # The eight example apps are one npm workspace (examples/); install once, build each.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - name: Install
        run: npm ci
      - name: Build every app
        run: npm run build


  dufynd-browser-qa:
    # Temporary PR #67 visual QA. Captures static-export screenshots only.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build DUFYND storefront
        run: |
          npm ci
          npm run build --workspace=acme-retail-storefront-web
      - name: Install Chromium QA runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture DUFYND responsive QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dufynd-browser-qa
          python -m http.server 3000 --directory retail/storefront-web/out >/tmp/dufynd-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path("dufynd-browser-qa")
          export_root = Path("retail/storefront-web/out")
          page_specs = {
              "home": ("", "DUFYND"),
              "catalog": ("duft", "Duftkatalog"),
              "naxos": ("duft/xerjoff-naxos", "Naxos"),
              "absolu-aventus": (
                  "duft/creed-absolu-aventus",
                  "Absolu Aventus",
              ),
              "prada-lhomme": ("duft/prada-lhomme", "L'Homme"),
              "bois-imperial": (
                  "duft/essential-parfums-bois-imperial",
                  "Bois Impérial",
              ),
          }
          widths = [320, 390, 768, 1440]

          def exported_url(route: str) -> str:
              if not route:
                  return "/"
              html = export_root / f"{route}.html"
              index = export_root / route / "index.html"
              if html.is_file():
                  return f"/{route}.html"
              if index.is_file():
                  return f"/{route}/index.html"
              raise AssertionError(f"No exported HTML for {route}")

          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              for width in widths:
                  height = 900 if width < 768 else 1000
                  page = browser.new_page(
                      viewport={"width": width, "height": height},
                      device_scale_factor=1,
                  )
                  errors = []
                  page.on(
                      "console",
                      lambda msg: errors.append(
                          f"console {msg.type}: {msg.text}"
                      )
                      if msg.type == "error"
                      else None,
                  )
                  page.on(
                      "pageerror",
                      lambda exc: errors.append(f"pageerror: {exc}"),
                  )
                  for name, (route, expected_text) in page_specs.items():
                      url_path = exported_url(route)
                      response = page.goto(
                          f"http://127.0.0.1:3000{url_path}",
                          wait_until="networkidle",
                      )
                      assert response is not None and response.ok, (
                          name,
                          url_path,
                          response.status if response else None,
                      )
                      body_text = page.locator("body").inner_text()
                      assert "Directory listing for" not in body_text, (
                          name,
                          url_path,
                      )
                      assert expected_text in body_text, (
                          name,
                          expected_text,
                      )
                      if name in {
                          "naxos",
                          "absolu-aventus",
                          "prada-lhomme",
                          "bois-imperial",
                      }:
                          assert "Duftnoten" in body_text, name
                      page.screenshot(
                          path=str(out / f"{name}-{width}.png"),
                          full_page=True,
                      )
                  if errors:
                      (out / f"errors-{width}.txt").write_text(
                          "\n".join(errors) + "\n",
                          encoding="utf-8",
                      )
                  page.close()
              browser.close()
          PY
      - name: Upload DUFYND browser QA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dufynd-browser-qa
          path: examples/dufynd-browser-qa/
          retention-days: 1
          if-no-files-found: error
