name: DUFYND CI

on:
  push:
    branches: [main, scentai-mvp]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Repo consistency checks
        run: python scripts/check.py

  no-pypi-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Package names are unregistered on the public index
        # Metadata-only tripwire, checked BEFORE any resolution below: if one of
        # these names ever appears on the index, fail here — without downloading
        # or building anything a squatter uploaded.
        run: |
          for name in commerce-common shopping-agent-core shopping-agent-runtime shopping-agent-sdk merchant-agent-core merchant-agent-runtime merchant-agent-sdk; do
            if pip index versions "$name" > idx.log 2>&1; then
              echo "ALERT: $name is registered on the public index"; cat idx.log; exit 1
            fi
            grep -q "No matching distribution found" idx.log || { cat idx.log; exit 1; }
          done
      - name: Cross-package resolution fails loudly outside the editable flow
        # Sibling deps are exact dev pins that no public index carries:
        # installing a package alone must error with "No matching
        # distribution found", never resolve a same-named public package.
        # Safe to resolve here: the step above already proved the names are
        # unregistered, and --only-binary forbids building any remote sdist
        # even in the window between the two steps (local dirs still build).
        run: |
          for pkg in ./shopping-agent/core ./shopping-agent/runtime-messages-api ./shopping-agent/runtime-agent-sdk ./merchant-agent/core ./merchant-agent/runtime-messages-api ./merchant-agent/runtime-agent-sdk; do
            if pip install --dry-run --only-binary=:all: "$pkg" > out.log 2>&1; then
              echo "UNEXPECTED: $pkg resolved without sibling installs"; cat out.log; exit 1
            fi
            grep -q "No matching distribution found" out.log || { cat out.log; exit 1; }
          done

  web:
    # The eight example apps are one npm workspace (examples/); install once, build each.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - name: Install
        run: npm ci
      - name: Build every app
        run: npm run build


  dufynd-visual-audit:
    # Temporary PR #67 artifact for human visual QA. Remove after the audit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install image audit dependency
        run: python -m pip install pillow==12.3.0
      - name: Build DUFYND product image audit sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter, ImageFont, ImageOps

          root = Path("examples/retail/storefront-web/public/products/pilot")
          files = sorted(
              p for p in root.iterdir()
              if p.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"}
          )
          assert files, "No DUFYND pilot product images found"

          tile_w, tile_h = 360, 460
          image_box = (18, 18, tile_w - 18, 360)
          label_y = 370
          cols = 4
          rows = (len(files) + cols - 1) // cols
          font = ImageFont.load_default()

          def load(path):
              return Image.open(path).convert("RGB")

          def fit_on_white(im, box):
              x0, y0, x1, y1 = box
              area = Image.new("RGB", (x1 - x0, y1 - y0), "white")
              fitted = ImageOps.contain(im, area.size)
              pos = ((area.width - fitted.width) // 2, (area.height - fitted.height) // 2)
              area.paste(fitted, pos)
              return area

          def editorial_safe_stage(im, box):
              x0, y0, x1, y1 = box
              w, h = x1 - x0, y1 - y0
              fill = ImageOps.fit(im, (w, h)).filter(ImageFilter.GaussianBlur(18))
              fill = fill.point(lambda p: int(p * 0.68))
              stage = fill.copy()
              margin_x = int(w * 0.12)
              margin_y = int(h * 0.08)
              inner = (w - 2 * margin_x, h - 2 * margin_y)
              fg = ImageOps.contain(im, inner)
              px = (w - fg.width) // 2
              py = (h - fg.height) // 2
              stage.paste(fg, (px, py))
              return stage

          def sheet(renderer, out):
              canvas = Image.new("RGB", (cols * tile_w, rows * tile_h), "#ece8df")
              draw = ImageDraw.Draw(canvas)
              for i, path in enumerate(files):
                  col, row = i % cols, i // cols
                  ox, oy = col * tile_w, row * tile_h
                  im = load(path)
                  rendered = renderer(im, image_box)
                  canvas.paste(rendered, (ox + image_box[0], oy + image_box[1]))
                  name = path.stem.replace("-editorial", "")
                  dims = f"{im.width}×{im.height}"
                  draw.text((ox + 18, oy + label_y), name[:46], fill="#171513", font=font)
                  draw.text((ox + 18, oy + label_y + 18), dims, fill="#5f584e", font=font)
                  draw.rectangle((ox, oy, ox + tile_w - 1, oy + tile_h - 1), outline="#c9c0b3")
              canvas.save(out, quality=91)

          sheet(fit_on_white, "dufynd-product-sources.jpg")
          sheet(editorial_safe_stage, "dufynd-product-safe-area-simulation.jpg")
          print(f"Generated audit sheets for {len(files)} DUFYND product visuals")
          PY
      - name: Upload DUFYND product visual audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dufynd-product-visual-audit
          path: |
            dufynd-product-sources.jpg
            dufynd-product-safe-area-simulation.jpg
          retention-days: 2
