name: DUFYND CI

on:
  push:
    branches: [main, scentai-mvp]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Repo consistency checks
        run: python scripts/check.py

  budget-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dufynd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DUFYND_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dufynd_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt psycopg[binary]==3.3.6
      - name: Real PostgreSQL budget contention and recovery
        run: pytest -q tests/test_dufynd_budget_postgres.py tests/test_jarvis_owner_session_postgres.py tests/test_dufynd_content_workflow_postgres.py tests/test_dufynd_first_money_replacement_postgres.py

  no-pypi-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Package names are unregistered on the public index
        # Metadata-only tripwire, checked BEFORE any resolution below: if one of
        # these names ever appears on the index, fail here — without downloading
        # or building anything a squatter uploaded.
        run: |
          for name in commerce-common shopping-agent-core shopping-agent-runtime shopping-agent-sdk merchant-agent-core merchant-agent-runtime merchant-agent-sdk; do
            if pip index versions "$name" > idx.log 2>&1; then
              echo "ALERT: $name is registered on the public index"; cat idx.log; exit 1
            fi
            grep -q "No matching distribution found" idx.log || { cat idx.log; exit 1; }
          done
      - name: Cross-package resolution fails loudly outside the editable flow
        # Sibling deps are exact dev pins that no public index carries:
        # installing a package alone must error with "No matching
        # distribution found", never resolve a same-named public package.
        # Safe to resolve here: the step above already proved the names are
        # unregistered, and --only-binary forbids building any remote sdist
        # even in the window between the two steps (local dirs still build).
        run: |
          for pkg in ./shopping-agent/core ./shopping-agent/runtime-messages-api ./shopping-agent/runtime-agent-sdk ./merchant-agent/core ./merchant-agent/runtime-messages-api ./merchant-agent/runtime-agent-sdk; do
            if pip install --dry-run --only-binary=:all: "$pkg" > out.log 2>&1; then
              echo "UNEXPECTED: $pkg resolved without sibling installs"; cat out.log; exit 1
            fi
            grep -q "No matching distribution found" out.log || { cat out.log; exit 1; }
          done

  web:
    # The eight example apps are one npm workspace (examples/); install once, build each.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - name: Restore Next.js build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/**/.next/cache
          key: ${{ runner.os }}-next-web-${{ hashFiles('examples/package-lock.json') }}-${{ hashFiles('examples/**/*.{js,jsx,ts,tsx,mjs,cjs,css}') }}
          restore-keys: |
            ${{ runner.os }}-next-web-${{ hashFiles('examples/package-lock.json') }}-
      - name: Install
        run: npm ci
      - name: Build every app
        shell: bash
        run: |
          set +e
          npm run build
          first_status=$?
          set -e
          if [ "$first_status" -ne 0 ]; then
            echo "::warning::Workspace build failed once; clearing Next.js build output and retrying once."
            find . -type d -name .next -prune -exec rm -rf {} +
            npm run build
          fi

      - name: Exercise DUFYND launch readiness checker
        run: npm run launch:check --workspace acme-retail-storefront-web

  dufynd-visual-qa:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'dufynd-') || startsWith(github.head_ref, 'fix/dufynd-'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - name: Restore DUFYND Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/retail/storefront-web/.next/cache
          key: ${{ runner.os }}-next-dufynd-qa-${{ hashFiles('examples/package-lock.json') }}-${{ hashFiles('examples/retail/storefront-web/**/*.{js,jsx,ts,tsx,mjs,cjs,css}') }}
          restore-keys: |
            ${{ runner.os }}-next-dufynd-qa-${{ hashFiles('examples/package-lock.json') }}-
      - name: Install storefront dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build DUFYND storefront
        run: npm run build --workspace acme-retail-storefront-web
      - name: Run responsive DUFYND browser QA
        shell: bash
        run: |
          set -euo pipefail
          node retail/storefront-web/scripts/serve-static-export.mjs \
            --root retail/storefront-web/out \
            --port 3000 > /tmp/dufynd-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --location http://127.0.0.1:3000/duft/xerjoff-naxos > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/dufynd-static.log
              exit 1
            fi
            sleep 1
          done
          node retail/storefront-web/scripts/dufynd-visual-qa.mjs \
            --base-url http://127.0.0.1:3000 \
            --out retail/storefront-web/.visual-qa
      - name: Run isolated Control Room evidence and content review replay
        working-directory: .
        run: |
          pip install -r requirements-dev.txt
          PYTHONPATH=examples python tests/browser/build_control_room_fixture.py /tmp/control-room-fixture.json
          NODE_PATH=examples/node_modules node tests/browser/control_room_evidence.cjs /tmp/control-room-fixture.json
      - name: Upload DUFYND visual QA captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dufynd-visual-qa-${{ github.event.pull_request.number }}
          path: examples/retail/storefront-web/.visual-qa
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  private-broker-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build isolated broker image without credentials
        run: docker build -f private_broker/Dockerfile -t dufynd-private-broker:test .
      - name: Verify isolated imports and fail-closed startup
        run: |
          docker run --rm --entrypoint python dufynd-private-broker:test -c 'from private_broker.runtime import production_app; from private_broker.store import FirestoreCAS'
          if docker run --rm dufynd-private-broker:test; then
            echo 'Broker unexpectedly started without owner configuration'
            exit 1
          fi

  private-observer-recovery:
    # Owner-authorized incident recovery, gated by the existing broker opt-in.
    # This uses the already reviewed fixed OIDC path; no Google/admin credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/scentai-mvp' && vars.DUFYND_PRIVATE_BROKER_ENABLED == '1'
    needs: [python, budget-postgres, web, private-broker-container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore existing observer workflows and dispatch one trusted recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recovered=0
          for workflow in dufynd-private-observer.yml dufynd-private-observer-watchdog.yml; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq '.state')
            if [[ "$state" == disabled_* ]]; then
              gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY"
              recovered=1
            elif [[ "$state" != active ]]; then
              echo "Unexpected observer workflow state; recovery stopped"
              exit 1
            fi
          done
          if [[ "$recovered" == 1 ]]; then
            gh workflow run dufynd-private-observer.yml --repo "$GITHUB_REPOSITORY" --ref scentai-mvp
          fi
