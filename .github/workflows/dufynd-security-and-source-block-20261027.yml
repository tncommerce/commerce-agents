name: DUFYND Security Candidate and Merchant Source Block
on:
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-security-and-source-block-20261027.yml]
permissions:
  contents: read
jobs:
  isolated-browser-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DUFYND_BROWSER_MODULE: /tmp/dufynd-browser-harness/node_modules/playwright
      DUFYND_PROBE_LIMIT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 833feefcd6e4c525ef83fcd0a3a3f9f9b72629f3
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install immutable candidate and separate browser harness
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '833feefcd6e4c525ef83fcd0a3a3f9f9b72629f3'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/dufynd_qa_source_block_20261027.cjs')
          s=p.read_text()
          old="require(path.resolve('candidate/examples/node_modules/playwright'))"
          assert s.count(old)==1
          p.write_text(s.replace(old,"require(process.env.DUFYND_BROWSER_MODULE)"))
          PY
          node --check scripts/dufynd_qa_source_block_20261027.cjs
          node --check scripts/dufynd_top_browser_observer_20261027.cjs
          (cd candidate/examples && npm ci --no-audit --no-fund)
          npm install --prefix /tmp/dufynd-browser-harness --no-package-lock --no-audit --no-fund playwright@1.55.0
          node /tmp/dufynd-browser-harness/node_modules/playwright/cli.js install --with-deps chromium
          git -C candidate diff --exit-code -- examples/package.json examples/package-lock.json examples/retail/storefront-web/package.json
          node - <<'JS'
          const assert=require('node:assert/strict'),{createRequire}=require('node:module'),path=require('node:path');
          const req=createRequire(path.resolve('candidate/examples/retail/storefront-web/package.json'));
          const versions=Object.fromEntries(['next','sharp','source-map-js'].map(p=>[p,req(p+'/package.json').version]));
          assert.deepEqual(versions,{next:'16.4.3',sharp:'0.35.5','source-map-js':'1.2.2'});
          console.log('EXACT_SECURITY_MODULE_VERSIONS='+JSON.stringify(versions));
          JS
      - name: Build exact locked candidate and verify buyer layout at four widths
        id: candidate_browser
        shell: bash
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3019
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3019
          NEXT_PUBLIC_SITE_INDEXABLE: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          (cd candidate/examples && npm run build --workspace acme-retail-storefront-web)
          git -C candidate diff --exit-code -- examples/package.json examples/package-lock.json examples/retail/storefront-web/package.json
          node candidate/examples/retail/storefront-web/scripts/serve-static-export.mjs --root candidate/examples/retail/storefront-web/out --port 3019 >/tmp/dufynd-candidate-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3019/duft/rabanne-1-million >/dev/null; then break; fi
            sleep 1
          done
          node scripts/dufynd_qa_source_block_20261027.cjs security
      - name: Inspect two selected merchant variants and shipping without transactions
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        run: node scripts/dufynd_top_browser_observer_20261027.cjs
