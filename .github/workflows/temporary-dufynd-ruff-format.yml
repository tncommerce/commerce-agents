name: Temporary DUFYND Ruff Format

on:
  push:
    branches:
      - dufynd-feed-image-rights-guard-20260922

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: dufynd-feed-image-rights-guard-20260922
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.3
      - name: Format changed Python files
        run: |
          ruff format scripts/approve_scentai_feed_image.py
          ruff format tests/test_scentai_feed_image_approval.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/approve_scentai_feed_image.py tests/test_scentai_feed_image_approval.py
          if git diff --cached --quiet; then
            echo "No formatter changes."
            exit 0
          fi
          git commit -m "Format feed image rights guard [skip ci]"
          git push origin HEAD:dufynd-feed-image-rights-guard-20260922
