name: DUFYND temporary Fleur final mapping refresh

on:
  push:
    branches:
      - dufynd-jpg-fleur-du-male-2026-mapping-20260928

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dufynd-jpg-fleur-du-male-2026-mapping-20260928
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Rebuild reproducible staging
        env:
          PYTHONPATH: ".:examples"
        run: python -m scripts.build_scentai_catalog_staging
      - name: Focused Fleur and merchant tests
        run: |
          pytest -q \
            tests/test_dufynd_merchant_mapping_integrity.py \
            tests/test_scentai_merchant_mapping_policy.py \
            tests/test_scentai_merchant_research_consistency.py \
            tests/test_scentai_staging_qa.py
      - name: Format check
        run: |
          ruff format --check \
            scripts/build_scentai_merchant_mapping_work_queue.py \
            tests/test_dufynd_merchant_mapping_integrity.py \
            tests/test_scentai_merchant_mapping_policy.py \
            tests/test_scentai_merchant_research_consistency.py
      - name: Refresh Jarvis state
        env:
          PYTHONPATH: ".:examples"
        run: python -m scripts.refresh_scentai_jarvis_state --write --machine-readable
      - name: Validate Jarvis state graph
        env:
          PYTHONPATH: ".:examples"
        run: python -m scripts.validate_scentai_jarvis_state_graph --machine-readable
      - name: Verify 50 of 50 mapping state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path("examples/retail/data/scentai_merchant_mapping_work_queue.json").read_text())
          s = q["summary"]
          assert s["staged_products"] == 50, s
          assert s["products_with_resolved_mapping"] == 50, s
          assert s["products_without_resolved_mapping"] == 0, s
          item = next(x for x in q["items"] if x["product_id"] == "SC-JPG-FLEUR-DU-MALE-2026-EDT-125")
          assert item["state"] == "mapping_data_ready", item
          assert item["resolved_mapping_count"] == 1, item
          assert item["full_mapping_count"] == 0, item
          assert "community_performance_still_provisional" in item["blockers"], item
          assert "verified_current_merchant_pending" not in item["blockers"], item
          print(json.dumps({"summary": s, "fleur": item}, indent=2))
          PY
      - name: Commit derived state
        run: |
          if git diff --quiet; then
            echo "No derived-state changes."
            exit 0
          fi
          git config user.name "tncommerce"
          git config user.email "tuanaicommerce@gmail.com"
          git add examples/retail/data
          git commit -m "DUFYND: refresh state after Fleur du Male 2026 mapping"
          git push
