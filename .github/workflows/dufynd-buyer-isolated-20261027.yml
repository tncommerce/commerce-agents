name: DUFYND buyer catalog and mobile test - isolated
on:
  push:
    branches: ["qa/dufynd-buyer-20261027"]
    paths: [".github/workflows/dufynd-buyer-isolated-20261027.yml"]
permissions:
  contents: read
jobs:
  first-party-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: examples
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DUFYND_RUNTIME_OFFER_SNAPSHOTS: "disabled"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install already pinned storefront workspace
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build current draft storefront only
        run: npm run build --workspace acme-retail-storefront-web
      - name: Inspect share URL and three licensed mobile stages without clickouts
        shell: bash
        run: |
          set -euo pipefail
          node retail/storefront-web/scripts/serve-static-export.mjs --root retail/storefront-web/out --port 3000 >/tmp/dufynd-buyer.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/duft >/dev/null; then break; fi
            if [ "$attempt" -eq 45 ]; then cat /tmp/dufynd-buyer.log; exit 1; fi
            sleep 1
          done
          node retail/storefront-web/scripts/diagnose-isolated-buyer.mjs
          node retail/storefront-web/scripts/dufynd-visual-qa.mjs --base-url http://127.0.0.1:3000 --out /tmp/dufynd-isolated-buyer-visual
