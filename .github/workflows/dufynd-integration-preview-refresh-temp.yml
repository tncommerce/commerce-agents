name: DUFYND Integration Preview Refresh

on:
  push:
    branches:
      - dufynd-integration-preview-20260926

permissions:
  contents: write

concurrency:
  group: dufynd-integration-preview-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip-integration-preview-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dufynd-integration-preview-20260926
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install repository Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Rebuild isolated staging
        run: python -m scripts.build_scentai_catalog_staging

      - name: Refresh derived DUFYND state
        run: PYTHONPATH=examples python -m scripts.refresh_scentai_jarvis_state --write --generated-at "2026-09-26T13:20:00+00:00"

      - name: Run focused integration tests
        run: |
          pytest -q \
            tests/test_scentai_staging_qa.py \
            tests/test_scentai_catalog_promotion.py \
            tests/test_scentai_release_manifest.py \
            tests/test_scentai_promotion_queue_policy.py

      - name: Commit regenerated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/data
          if git diff --cached --quiet; then
            echo "No regenerated state changes."
            exit 0
          fi
          git commit -m "Refresh DUFYND integration preview state [skip-integration-preview-refresh]"
          git push origin HEAD:dufynd-integration-preview-20260926
