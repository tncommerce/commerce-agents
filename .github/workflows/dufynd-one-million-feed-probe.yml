name: DUFYND 1 Million Feed Probe

on:
  push:
    branches:
      - dufynd-one-million-live-20260929
    paths:
      - ".github/workflows/dufynd-one-million-feed-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Probe current Awin feeds without exposing secrets
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AWIN_DATA_FEED_API_KEY:-}" ]; then
            echo "::error::Repository secret AWIN_DATA_FEED_API_KEY is not configured."
            exit 2
          fi

          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          from scripts.fetch_dufynd_awin_data_feed import (
              DEFAULT_FEED_MAX_BYTES,
              DEFAULT_LIST_MAX_BYTES,
              _read_url,
              _row_value,
              download_feed_from_list,
              parse_feed_list,
              sanitized_feed_metadata,
          )

          api_key = os.environ["AWIN_DATA_FEED_API_KEY"].strip()
          list_url = "https://productdata.awin.com/datafeed/list/apikey/" + __import__("urllib.parse").parse.quote(api_key, safe="")
          rows = parse_feed_list(
              _read_url(list_url, max_bytes=DEFAULT_LIST_MAX_BYTES),
              max_bytes=DEFAULT_LIST_MAX_BYTES,
          )

          targets = {"11672", "31081"}
          target_rows = [
              row for row in rows
              if _row_value(row, "Advertiser ID") in targets
          ]

          report = {
              "version": 1,
              "targets": {
                  advertiser_id: [
                      sanitized_feed_metadata(row)
                      for row in target_rows
                      if _row_value(row, "Advertiser ID") == advertiser_id
                  ]
                  for advertiser_id in sorted(targets)
              },
              "matches": [],
          }

          def norm(value):
              return " ".join(str(value or "").casefold().split())

          def field(row, *aliases):
              normalized = {
                  "".join(ch for ch in str(key).casefold() if ch.isalnum()):
                      str(value or "").strip()
                  for key, value in row.items()
              }
              for alias in aliases:
                  key = "".join(ch for ch in alias.casefold() if ch.isalnum())
                  value = normalized.get(key, "")
                  if value:
                      return value
              return ""

          for source_row in target_rows:
              metadata = sanitized_feed_metadata(source_row)
              if not metadata.get("joined"):
                  continue
              advertiser_id = str(metadata.get("advertiser_id") or "")
              feed_id = str(metadata.get("feed_id") or "")
              if not advertiser_id or not feed_id:
                  continue

              output = Path(f"/tmp/awin-{advertiser_id}-{feed_id}.csv")
              try:
                  download_feed_from_list(
                      api_key=api_key,
                      advertiser_id=advertiser_id,
                      feed_id=feed_id,
                      output_path=output,
                      report_path=None,
                      feed_max_bytes=DEFAULT_FEED_MAX_BYTES,
                  )
              except Exception as exc:
                  report["matches"].append({
                      "advertiser_id": advertiser_id,
                      "feed_id": feed_id,
                      "status": "download_failed",
                      "error_class": type(exc).__name__,
                  })
                  continue

              with output.open("r", encoding="utf-8-sig", newline="") as handle:
                  reader = csv.DictReader(handle)
                  for row in reader:
                      ean = field(row, "ean")
                      gtin = field(row, "product_GTIN", "gtin")
                      name = field(row, "product_name", "merchant_product_name", "name")
                      name_norm = norm(name)
                      exact_id = "3349666007921" in {ean, gtin}
                      exact_name = (
                          "1 million" in name_norm
                          and ("100 ml" in name_norm or "100ml" in name_norm)
                          and (
                              "eau de toilette" in name_norm
                              or "edt" in name_norm
                          )
                      )
                      if not (exact_id or exact_name):
                          continue

                      report["matches"].append({
                          "advertiser_id": advertiser_id,
                          "advertiser_name": metadata.get("advertiser_name"),
                          "feed_id": feed_id,
                          "feed_name": metadata.get("feed_name"),
                          "membership_status": metadata.get("membership_status"),
                          "last_imported": metadata.get("last_imported"),
                          "product_name": name,
                          "merchant_product_id": field(row, "merchant_product_id"),
                          "aw_product_id": field(row, "aw_product_id"),
                          "ean": ean or None,
                          "gtin": gtin or None,
                          "price": field(row, "search_price"),
                          "currency": field(row, "currency"),
                          "in_stock": field(row, "in_stock"),
                          "merchant_image_url": field(row, "merchant_image_url", "image_url"),
                          "merchant_deep_link": field(row, "merchant_deep_link"),
                          "last_updated": field(row, "last_updated"),
                          "match_basis": "gtin" if exact_id else "name_variant",
                      })

          Path("/tmp/one-million-awin-probe.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload sanitized probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dufynd-one-million-awin-probe-${{ github.run_number }}
          path: /tmp/one-million-awin-probe.json
          if-no-files-found: error
          retention-days: 2
