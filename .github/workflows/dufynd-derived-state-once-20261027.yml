name: DUFYND One-Shot Derived State Reconciliation
on:
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-derived-state-once-20261027.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7beeaa6f5658ad5914789db04f78eca721a0f6cd
          persist-credentials: false
      - name: Rebuild committed Jarvis derived files from exact source only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.refresh_scentai_jarvis_state --write --generated-at '2026-10-09T13:19:11+00:00' --machine-readable
          python3 - <<'PY'
          import json, subprocess, pathlib, sys
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          print('DUFYND_DERIVED_CHANGED_PATHS='+json.dumps(changed))
          allowed={
              'examples/retail/data/scentai_merchant_mapping_work_queue.json',
              'examples/retail/data/scentai_jarvis_master_status.json',
              'examples/retail/data/scentai_jarvis_operations_status.json',
              'examples/retail/data/scentai_release_01_gate_status.json',
              'examples/retail/data/scentai_release_pipeline_status.json',
          }
          if set(changed)!=allowed:
              print('unexpected_derivation_delta',file=sys.stderr)
              sys.exit(2)
          for p in changed:
              file_content=pathlib.Path(p).read_text(encoding='utf-8')
              encoded=json.dumps(file_content,ensure_ascii=True)
              chunk_size=5000
              parts=[encoded[i:i+chunk_size] for i in range(0,len(encoded),chunk_size)]
              for i,part in enumerate(parts):
                  print('DUFYND_DERIVED_CHUNK='+json.dumps({'path':p,'chunk':i,'count':len(parts),'text':part},ensure_ascii=True))
          print('Derived reconciliation complete; no Git ref, Supabase, or production changes')
          PY
