name: DUFYND One-Shot Ruff Fix Preview
on:
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-ruff-format-once-20261027.yml]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 845e29d4af2dc2f7e7c10cef3716c6ab30537b92
          persist-credentials: false
      - name: Fixed exact file formatting preview only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff==0.16.3
          ruff check --fix scripts/prepare_dufynd_staging_photo_preview.py tests/test_dufynd_staging_photo_preview.py
          echo DUFYND_RUFF_FORMAT_DIFF_BEGIN
          ruff format --diff scripts/prepare_dufynd_staging_photo_preview.py tests/test_dufynd_staging_photo_preview.py || true
          echo DUFYND_RUFF_FORMAT_DIFF_END
          echo No source files, branches, production, or permissions were changed
