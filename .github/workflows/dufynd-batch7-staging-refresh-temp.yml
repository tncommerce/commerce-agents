name: DUFYND Batch 7 Temporary Staging Refresh

on:
  push:
    branches:
      - dufynd-catalog-batch7-staging-20260926

permissions:
  contents: write

concurrency:
  group: dufynd-batch7-staging-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip-batch7-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dufynd-catalog-batch7-staging-20260926
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install repo Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate and rebuild Batch 7 staging
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.validate_dufynd_catalog_expansion_wave             --wave examples/retail/data/dufynd_catalog_expansion_batch7_research.json
          python -m scripts.build_scentai_catalog_staging
          python -m scripts.refresh_scentai_jarvis_state             --write             --generated-at "2026-09-26T07:35:00+00:00"

      - name: Commit regenerated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/data
          if git diff --cached --quiet; then
            echo "No generated state changes."
            exit 0
          fi
          git commit -m "Regenerate DUFYND Batch 7 staging state [skip-batch7-refresh]"
          git push origin HEAD:dufynd-catalog-batch7-staging-20260926
