name: DUFYND One-Shot Top Variant Source Signals
on:
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-top-variant-signal-one-shot-20261027.yml]
permissions:
  contents: read
jobs:
  bounded-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safely inspect two exact non-affiliate merchant product pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          
          BASE='https://www.topparfuemerie.de'
          PRODUCTS=[
              ('SC-RABANNE-1-MILLION-EDT-100','707368','3349666007921','/rabanne-1-million-edt-nat-spray'),
              ('SC-MONTBLANC-EXPLORER-100','849457','3386460101035','/montblanc-explorer-edp-nat-spray'),
          ]
          LIMIT=4_000_000
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise ValueError('shop_redirect_hold')
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.scripts=[]
                  self.raw=[]
                  self.collect=False
                  self.type=''
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      values=dict(attrs)
                      self.collect=True
                      self.raw=[]
                      self.type=values.get('type','')
              def handle_data(self,data):
                  if self.collect:
                      self.raw.append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.collect:
                      contents=''.join(self.raw)
                      if contents and len(contents)<1_000_000:
                          self.scripts.append((self.type,contents))
                      self.collect=False
                      self.raw=[]
          
          def out(obj):
              print('DUFYND_TOP_VARIANT_SOURCE_SIGNAL='+json.dumps(obj,ensure_ascii=True))
          assert len(PRODUCTS)==2
          for pid,sku,ean,path in PRODUCTS:
              url=BASE+path
              parsed=urlsplit(url)
              assert parsed.scheme=='https' and parsed.netloc=='www.topparfuemerie.de'
              assert not parsed.query and not parsed.fragment and not parsed.username
              result={'product_id':pid,'target_sku':sku,'target_historic_ean':ean,
                      'source':'merchant_product_page_public_get_not_affiliate',
                      'source_checked':False,'fresh_stock_price_verified':False,
                      'merchant_checkout_selected_variant_verified':False,
                      'affiliate_clickouts':0,'publications':0}
              try:
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'Mozilla/5.0 (compatible; DUFYND-PublisherReadOnly/1.0)',
                      'Accept':'text/html','Accept-Encoding':'identity'})
                  with urllib.request.build_opener(NoRedirect()).open(req,timeout=12) as r:
                      if r.status!=200:
                          raise ValueError('non_200_source')
                      ctype=r.headers.get('Content-Type','').lower()
                      if 'text/html' not in ctype:raise ValueError('not_html_source')
                      raw=r.read(LIMIT+1)
                      if len(raw)>LIMIT:raise ValueError('source_oversized')
                  html=raw.decode('utf-8',errors='replace')
                  capture=Scripts();capture.feed(html)
                  result.update(source_checked=True,http_status=200,html_bytes=len(raw),
                                sku_literal_count=html.count(sku),historic_ean_literal_count=html.count(ean),
                                size_100_ml_literal_count=len(re.findall(r'100\s?ml\b',html,re.I)),
                                script_count=len(capture.scripts),
                                magento_optionprice_key_count=html.count('optionPrices'),
                                has_configurable_options='spConfig' in html)
                  product_json=[]
                  for ty,s in capture.scripts:
                      if ty.lower()!='application/ld+json':continue
                      try:data=json.loads(s)
                      except ValueError:continue
                      candidates=data if isinstance(data,list) else [data]
                      for obj in candidates:
                          if not isinstance(obj,dict):continue
                          if obj.get('@type')=='Product':
                              offers=obj.get('offers',{})
                              o=offers[0] if isinstance(offers,list) and offers else offers
                              if not isinstance(o,dict):o={}
                              price=o.get('price')
                              avail=str(o.get('availability',''))[-70:]
                              product_json.append({'sku':str(obj.get('sku',''))[:35],
                                                  'gtin':str(obj.get('gtin13',obj.get('gtin','')))[:35],
                                                  'offer_price':str(price)[:28] if price is not None else None,
                                                  'currency':str(o.get('priceCurrency',''))[:10],
                                                  'availability':avail})
                  result['jsonld_product_offers']=product_json[:3]
                  price_configs=[]
                  for ty,script in capture.scripts:
                      if 'optionPrices' not in script:continue
                      try:structured=json.loads(script)
                      except (ValueError,TypeError):continue
                      found=[]
                      def scan(value,depth=0):
                          if depth>14 or len(found)>12:return
                          if isinstance(value,dict):
                              if isinstance(value.get('optionPrices'),dict):
                                  found.append((value['optionPrices'],value.get('attributes'),value.get('index')))
                              for sub in list(value.values())[:100]:
                                  scan(sub,depth+1)
                          elif isinstance(value,list):
                              for sub in value[:100]:
                                  scan(sub,depth+1)
                      scan(structured)
                      for entries,attrs,index in found:
                          exact=entries.get(sku)
                          final=None
                          if isinstance(exact,dict):
                              price=exact.get('finalPrice')
                              if isinstance(price,dict) and isinstance(price.get('amount'),(int,float)):
                                  final=price['amount']
                          variant_options=[]
                          if isinstance(attrs,dict):
                              for attribute in list(attrs.values())[:10]:
                                  if not isinstance(attribute,dict):continue
                                  for option in attribute.get('options',[])[:24]:
                                      if not isinstance(option,dict):continue
                                      label=str(option.get('label',''))[:65]
                                      pids=option.get('products',[])
                                      if not isinstance(pids,list):pids=[]
                                      prices=[]
                                      for sid in pids[:5]:
                                          record=entries.get(str(sid),{})
                                          if not isinstance(record,dict):continue
                                          value=record.get('finalPrice',{})
                                          if isinstance(value,dict) and isinstance(value.get('amount'),(int,float)):
                                              prices.append({'internal_id':str(sid)[:20],
                                                             'price_hint':value['amount']})
                                      if ('ml' in label.lower() or '100' in label) and prices:
                                          variant_options.append({'label':label,'options':prices})
                          price_configs.append({
                              'config_id_count':len(entries),
                              'exact_merchant_sku_present':sku in entries,
                              'exact_sku_final_price_hint':final,
                              'first_numeric_keys':sorted(str(x) for x in entries)[:12],
                              'size_label_options_with_internal_prices':variant_options[:8],
                              'attribute_config_keys':list(attrs.keys())[:6] if isinstance(attrs,dict) else []})
                  result['parsed_magento_option_price_configs']=price_configs[:5]
                  result['script_json_parseable_option_price_nodes']=len(price_configs)
                  result['structured_price_proof_possible']=any(
                      p['exact_merchant_sku_present'] and p['exact_sku_final_price_hint'] is not None
                      for p in price_configs
                  )
                  # Read-only hint only. A literal SKU in a multi-size product
                  # page never independently confirms current selected variant.
                  result['status']='SOURCE_PARSED_REVIEW_ONLY_NO_BUYER_PRICE_CERTIFICATION'
              except Exception as err:
                  result['status']='HOLD_SOURCE_NOT_READABLE'
                  result['failure_type']=type(err).__name__
                  if isinstance(err,urllib.error.HTTPError):
                      result['http_status']=err.code
              out(result)
          PY
# Extended one-time structured variant config read, no affiliate redirects or shopper sessions
