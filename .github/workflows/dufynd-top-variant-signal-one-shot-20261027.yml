name: DUFYND One-Shot Top Variant Source Signals
on:
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-top-variant-signal-one-shot-20261027.yml]
permissions:
  contents: read
jobs:
  bounded-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safely inspect two exact non-affiliate merchant product pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          
          BASE='https://www.topparfuemerie.de'
          PRODUCTS=[
              ('SC-RABANNE-1-MILLION-EDT-100','707368','3349666007921','/rabanne-1-million-edt-nat-spray'),
              ('SC-MONTBLANC-EXPLORER-100','849457','3386460101035','/montblanc-explorer-edp-nat-spray'),
          ]
          LIMIT=4_000_000
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise ValueError('shop_redirect_hold')
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.scripts=[]
                  self.raw=[]
                  self.collect=False
                  self.type=''
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      values=dict(attrs)
                      self.collect=True
                      self.raw=[]
                      self.type=values.get('type','')
              def handle_data(self,data):
                  if self.collect:
                      self.raw.append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.collect:
                      contents=''.join(self.raw)
                      if contents and len(contents)<1_000_000:
                          self.scripts.append((self.type,contents))
                      self.collect=False
                      self.raw=[]
          
          def out(obj):
              print('DUFYND_TOP_VARIANT_SOURCE_SIGNAL='+json.dumps(obj,ensure_ascii=True))
          assert len(PRODUCTS)==2
          for pid,sku,ean,path in PRODUCTS:
              url=BASE+path
              parsed=urlsplit(url)
              assert parsed.scheme=='https' and parsed.netloc=='www.topparfuemerie.de'
              assert not parsed.query and not parsed.fragment and not parsed.username
              result={'product_id':pid,'target_sku':sku,'target_historic_ean':ean,
                      'source':'merchant_product_page_public_get_not_affiliate',
                      'source_checked':False,'fresh_stock_price_verified':False,
                      'merchant_checkout_selected_variant_verified':False,
                      'affiliate_clickouts':0,'publications':0}
              try:
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'Mozilla/5.0 (compatible; DUFYND-PublisherReadOnly/1.0)',
                      'Accept':'text/html','Accept-Encoding':'identity'})
                  with urllib.request.build_opener(NoRedirect()).open(req,timeout=12) as r:
                      if r.status!=200:
                          raise ValueError('non_200_source')
                      ctype=r.headers.get('Content-Type','').lower()
                      if 'text/html' not in ctype:raise ValueError('not_html_source')
                      raw=r.read(LIMIT+1)
                      if len(raw)>LIMIT:raise ValueError('source_oversized')
                  html=raw.decode('utf-8',errors='replace')
                  capture=Scripts();capture.feed(html)
                  result.update(source_checked=True,http_status=200,html_bytes=len(raw),
                                sku_literal_count=html.count(sku),historic_ean_literal_count=html.count(ean),
                                size_100_ml_literal_count=len(re.findall(r'100\s?ml\b',html,re.I)),
                                script_count=len(capture.scripts),
                                magento_optionprice_key_count=html.count('optionPrices'),
                                has_configurable_options='spConfig' in html)
                  product_json=[]
                  for ty,s in capture.scripts:
                      if ty.lower()!='application/ld+json':continue
                      try:data=json.loads(s)
                      except ValueError:continue
                      candidates=data if isinstance(data,list) else [data]
                      for obj in candidates:
                          if not isinstance(obj,dict):continue
                          if obj.get('@type')=='Product':
                              offers=obj.get('offers',{})
                              o=offers[0] if isinstance(offers,list) and offers else offers
                              if not isinstance(o,dict):o={}
                              price=o.get('price')
                              avail=str(o.get('availability',''))[-70:]
                              product_json.append({'sku':str(obj.get('sku',''))[:35],
                                                  'gtin':str(obj.get('gtin13',obj.get('gtin','')))[:35],
                                                  'offer_price':str(price)[:28] if price is not None else None,
                                                  'currency':str(o.get('priceCurrency',''))[:10],
                                                  'availability':avail})
                  result['jsonld_product_offers']=product_json[:3]
                  # Read-only hint only. A literal SKU in a multi-size product
                  # page never independently confirms current selected variant.
                  result['status']='SOURCE_PARSED_REVIEW_ONLY_NO_BUYER_PRICE_CERTIFICATION'
              except Exception as err:
                  result['status']='HOLD_SOURCE_NOT_READABLE'
                  result['failure_type']=type(err).__name__
                  if isinstance(err,urllib.error.HTTPError):
                      result['http_status']=err.code
              out(result)
          PY
