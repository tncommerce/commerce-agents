name: DUFYND Jarvis Bootstrap Runner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Jarvis mode
        required: true
        default: readiness
        type: choice
        options:
          - readiness
          - process-next
      runtime_ref:
        description: Reviewed branch/ref containing the Jarvis runtime
        required: true
        default: dufynd-jarvis-autonomy-20260920
        type: string
      expected_runtime_sha:
        description: Exact reviewed commit SHA that runtime_ref must resolve to
        required: true
        default: 814dd326d1203e44983cf947127ba3d8737dfdc6
        type: string
      approval_token:
        description: Required only for process-next
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dufynd-jarvis-bootstrap-runner
  cancel-in-progress: false

jobs:
  jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested runtime ref
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.runtime_ref }}" in
            dufynd-jarvis-autonomy-20260920|scentai-mvp)
              ;;
            *)
              echo "Refused runtime_ref: only the reviewed Jarvis branch or scentai-mvp is allowed."
              exit 21
              ;;
          esac

      - name: Check out reviewed runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.runtime_ref }}
          persist-credentials: false

      - name: Verify exact runtime commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "${{ inputs.expected_runtime_sha }}" ]; then
            echo "Runtime SHA mismatch. Expected ${{ inputs.expected_runtime_sha }}, got $actual_sha."
            exit 22
          fi
          test -f scripts/dufynd_jarvis_runtime.py
          test -f examples/retail/data/dufynd_jarvis_contract.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reviewed runtime dependencies
        run: pip install -r requirements-dev.txt

      - name: Readiness only
        if: inputs.mode == 'readiness'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUFYND_JARVIS_MODEL: ${{ vars.DUFYND_JARVIS_MODEL }}
          DUFYND_JARVIS_ACTIVE: "0"
        run: python scripts/dufynd_jarvis_runtime.py --readiness

      - name: Validate explicit active-run approval
        if: inputs.mode == 'process-next'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.approval_token }}" != "GO-JARVIS-ACTIVE" ]; then
            echo "Active Jarvis run refused: explicit GO-JARVIS-ACTIVE token is required."
            exit 20
          fi

      - name: Process one Jarvis event
        if: inputs.mode == 'process-next'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUFYND_JARVIS_MODEL: ${{ vars.DUFYND_JARVIS_MODEL }}
          DUFYND_JARVIS_MAX_TURNS: "8"
          DUFYND_JARVIS_MAX_BUDGET_USD: "0.25"
          DUFYND_JARVIS_BUDGET_ID: "jarvis_activation_pilot_001"
          DUFYND_JARVIS_ACTIVE: "1"
        run: python scripts/dufynd_jarvis_runtime.py --process-next
