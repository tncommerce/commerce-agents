name: DUFYND 3D Model Review Packet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build rights-cleared true-3D review bundle
        run: |
          python scripts/build_scentai_model3d_review_bundle.py             --output-dir "${RUNNER_TEMP}/dufynd-model3d-review"

      - name: Upload review-only 3D packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dufynd-model3d-review-${{ github.run_number }}
          path: ${{ runner.temp }}/dufynd-model3d-review
          if-no-files-found: error
          retention-days: 7
