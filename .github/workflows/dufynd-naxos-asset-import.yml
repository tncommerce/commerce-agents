name: DUFYND Naxos Asset Import

on:
  push:
    branches:
      - dufynd-offers-3d-look-20260924

permissions:
  contents: write

jobs:
  import-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dufynd-offers-3d-look-20260924

      - name: Import production Naxos cutout
        shell: bash
        run: |
          set -euo pipefail
          TARGET="examples/retail/storefront-web/public/products/naxos-cutout-production.png"
          if [ -s "$TARGET" ]; then
            echo "Asset already present; nothing to do."
            exit 0
          fi

          mkdir -p "$(dirname "$TARGET")"
          curl --fail --location --silent --show-error             'https://d2ol7oe51mr4n9.cloudfront.net/user_3JXl0ZPj88sOyjaaKoV9lI8uIys/7e011f73-fc31-410d-b95e-2a019b36f55e.png'             -o "$TARGET"

          test -s "$TARGET"
          file "$TARGET"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "Add production Naxos bottle cutout"
          git push origin HEAD:dufynd-offers-3d-look-20260924
