name: DUFYND temporary Eros EDP state refresh

on:
  push:
    branches:
      - dufynd-versace-eros-edp-100-purchase-20260927

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dufynd-versace-eros-edp-100-purchase-20260927
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Focused integrity test
        run: pytest -q tests/test_dufynd_merchant_offer_integrity.py
      - name: Refresh Jarvis state
        env:
          PYTHONPATH: ".:examples"
        run: python -m scripts.refresh_scentai_jarvis_state --write --machine-readable
      - name: Validate Jarvis state graph
        env:
          PYTHONPATH: ".:examples"
        run: python -m scripts.validate_scentai_jarvis_state_graph --machine-readable
      - name: Commit derived state
        run: |
          if git diff --quiet; then
            echo "No derived-state changes."
            exit 0
          fi
          git config user.name "tncommerce"
          git config user.email "tuanaicommerce@gmail.com"
          git add examples/retail/data
          git commit -m "DUFYND: refresh state after Eros EDP mapping"
          git push
