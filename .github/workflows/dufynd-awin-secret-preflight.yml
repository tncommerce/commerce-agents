name: DUFYND Awin Secret Readiness Preflight

on:
  push:
    branches:
      - dufynd-awin-secret-readiness-preflight-20260928
    paths:
      - .github/workflows/dufynd-awin-secret-preflight.yml

permissions:
  contents: read

jobs:
  awin-secret-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Check Awin data-feed secret presence
        shell: bash
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWIN_DATA_FEED_API_KEY:-}" ]; then
            echo "::error::AWIN_DATA_FEED_API_KEY is not configured."
            exit 2
          fi
          echo "AWIN_DATA_FEED_API_KEY is configured."
