name: SCENTAI Pilot Preview Render

on:
  workflow_dispatch:
  push:
    branches: [scentai-mvp]
    paths:
      - "scripts/render_scentai_pilot_previews.py"
      - "examples/retail/data/scentai_pilot_batch_01.json"
      - "examples/retail/data/scentai_products.json"
      - ".github/workflows/scentai-pilot-preview.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: scentai-mvp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Render SCENTAI pilot previews
        run: python scripts/render_scentai_pilot_previews.py

      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/storefront-web/public/social/pilots/batch01
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi
          git commit -m "Generate SCENTAI pilot preview renders [skip ci]"
          git push origin HEAD:scentai-mvp
