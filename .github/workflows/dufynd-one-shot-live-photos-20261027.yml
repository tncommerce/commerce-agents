name: DUFYND One-Shot Live Photo Acceptance
on:
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-one-shot-live-photos-20261027.yml]
permissions:
  contents: read
jobs:
  ten-original-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify public HTML contains ten exact licensed original photos
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dufynd_live_photo_http_qa_20261027.py --self-test
          python3 scripts/dufynd_live_photo_http_qa_20261027.py
