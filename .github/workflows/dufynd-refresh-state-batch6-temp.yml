name: DUFYND Batch 6 Temporary State Refresh

on:
  push:
    branches:
      - dufynd-catalog-expansion-batch6-20260925

permissions:
  contents: write

concurrency:
  group: dufynd-batch6-state-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dufynd-catalog-expansion-batch6-20260925
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Refresh derived DUFYND state
        run: python -m scripts.refresh_scentai_jarvis_state --write --generated-at "2026-09-25T19:58:00+00:00"

      - name: Commit regenerated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/data
          if git diff --cached --quiet; then
            echo "No derived-state changes."
            exit 0
          fi
          git commit -m "Refresh DUFYND Batch 6 derived state [skip-refresh]"
          git push origin HEAD:dufynd-catalog-expansion-batch6-20260925
