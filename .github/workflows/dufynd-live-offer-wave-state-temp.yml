name: DUFYND Live Offer Wave Temporary State Sync

on:
  push:
    branches:
      - dufynd-live-offer-coverage-wave-20260926

permissions:
  contents: write

concurrency:
  group: dufynd-live-offer-wave-state-sync
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip-live-offer-state-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dufynd-live-offer-coverage-wave-20260926
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install repository Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Refresh derived DUFYND state
        run: PYTHONPATH=examples python -m scripts.refresh_scentai_jarvis_state --write --generated-at "2026-09-26T16:25:00+00:00"

      - name: Commit regenerated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/data
          if git diff --cached --quiet; then
            echo "No derived-state changes."
            exit 0
          fi
          git commit -m "Refresh DUFYND live offer wave state [skip-live-offer-state-sync]"
          git push origin HEAD:dufynd-live-offer-coverage-wave-20260926
