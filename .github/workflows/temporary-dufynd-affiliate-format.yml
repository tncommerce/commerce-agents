name: Temporary DUFYND Affiliate Format

on:
  push:
    branches:
      - dufynd-affiliate-decisions-20260922

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: dufynd-affiliate-decisions-20260922
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.3
      - name: Format changed Python files
        run: |
          ruff format \
            scripts/evaluate_scentai_affiliate_activation.py \
            scripts/build_scentai_release_feed_activation_queue.py \
            tests/test_scentai_affiliate_activation_status.py \
            tests/test_scentai_release_feed_activation_queue.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/evaluate_scentai_affiliate_activation.py
          git add scripts/build_scentai_release_feed_activation_queue.py
          git add tests/test_scentai_affiliate_activation_status.py
          git add tests/test_scentai_release_feed_activation_queue.py
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "Format affiliate decision changes [skip ci]"
          git push origin HEAD:dufynd-affiliate-decisions-20260922
