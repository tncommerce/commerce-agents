name: DUFYND Jarvis Manual Runner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Jarvis mode
        required: true
        default: readiness
        type: choice
        options:
          - readiness
          - sync-state
          - process-next
          - process-loop
          - autonomous-cycle
          - process-safe-task
          - process-branch-task
      max_events:
        description: Maximum events for process-loop
        required: false
        default: "8"
        type: string
      approval_token:
        description: Required for active event processing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dufynd-jarvis-manual-runner
  cancel-in-progress: false

jobs:
  jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install DUFYND runtime dependencies
        run: pip install -r requirements-dev.txt

      - name: Readiness only
        if: inputs.mode == 'readiness'
        env:
          SUPABASE_URL: "https://bqsdxaagklpkxioaqdqa.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUFYND_JARVIS_MODEL: ${{ vars.DUFYND_JARVIS_MODEL }}
          DUFYND_JARVIS_ACTIVE: "0"
        run: python -m scripts.dufynd_jarvis_runtime --readiness

      - name: Refresh repository Jarvis state
        if: inputs.mode == 'sync-state' || inputs.mode == 'process-next' || inputs.mode == 'process-loop' || inputs.mode == 'autonomous-cycle' || inputs.mode == 'process-safe-task' || inputs.mode == 'process-branch-task'
        run: >-
          python -m scripts.refresh_scentai_jarvis_state
          --write
          --machine-readable

      - name: Sync Jarvis control plane
        if: inputs.mode == 'sync-state' || inputs.mode == 'process-next' || inputs.mode == 'process-loop' || inputs.mode == 'autonomous-cycle' || inputs.mode == 'process-safe-task' || inputs.mode == 'process-branch-task'
        env:
          SUPABASE_URL: "https://bqsdxaagklpkxioaqdqa.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python -m scripts.sync_dufynd_repo_state_to_supabase
          --write
          --machine-readable

      - name: Verify Jarvis control-plane freshness
        if: inputs.mode == 'sync-state' || inputs.mode == 'process-next' || inputs.mode == 'process-loop' || inputs.mode == 'autonomous-cycle' || inputs.mode == 'process-safe-task' || inputs.mode == 'process-branch-task'
        env:
          SUPABASE_URL: "https://bqsdxaagklpkxioaqdqa.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python -m scripts.dufynd_jarvis_freshness
          --max-lag-hours 0
          --machine-readable

      - name: Validate explicit active-run approval
        if: inputs.mode == 'process-next' || inputs.mode == 'process-loop' || inputs.mode == 'process-safe-task' || inputs.mode == 'process-branch-task'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.approval_token }}" != "GO-JARVIS-ACTIVE" ]; then
            echo "Active Jarvis run refused: explicit GO-JARVIS-ACTIVE token is required."
            exit 20
          fi

      - name: Validate autonomous session switch
        if: inputs.mode == 'autonomous-cycle'
        env:
          DUFYND_JARVIS_AUTONOMOUS: ${{ vars.DUFYND_JARVIS_AUTONOMOUS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DUFYND_JARVIS_AUTONOMOUS:-0}" != "1" ]; then
            echo "Autonomous Jarvis cycle refused: DUFYND_JARVIS_AUTONOMOUS must be 1."
            exit 23
          fi

      - name: Process one Jarvis event
        if: inputs.mode == 'process-next'
        env:
          SUPABASE_URL: "https://bqsdxaagklpkxioaqdqa.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUFYND_JARVIS_MODEL: ${{ vars.DUFYND_JARVIS_MODEL }}
          DUFYND_JARVIS_MAX_TURNS: "8"
          DUFYND_JARVIS_MAX_BUDGET_USD: "0.25"
          DUFYND_JARVIS_BUDGET_ID: "jarvis_activation_pilot_001"
          DUFYND_JARVIS_ACTIVE: "1"
        run: python -m scripts.dufynd_jarvis_runtime --process-next

      - name: Run bounded Jarvis supervisor
        if: inputs.mode == 'process-loop'
        env:
          SUPABASE_URL: "https://bqsdxaagklpkxioaqdqa.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUFYND_JARVIS_MODEL: ${{ vars.DUFYND_JARVIS_MODEL }}
          DUFYND_JARVIS_MAX_TURNS: "8"
          DUFYND_JARVIS_MAX_BUDGET_USD: "0.25"
          DUFYND_JARVIS_BUDGET_ID: "jarvis_activation_pilot_001"
          DUFYND_JARVIS_ACTIVE: "1"
        run: >-
          python -m scripts.dufynd_jarvis_runtime
          --process-loop
          --max-events "${{ inputs.max_events }}"

      - name: Run budget-gated Jarvis autonomous cycle
        if: inputs.mode == 'autonomous-cycle'
        env:
          SUPABASE_URL: "https://bqsdxaagklpkxioaqdqa.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUFYND_JARVIS_MODEL: ${{ vars.DUFYND_JARVIS_MODEL }}
          DUFYND_JARVIS_AUTONOMOUS: ${{ vars.DUFYND_JARVIS_AUTONOMOUS }}
          DUFYND_JARVIS_MAX_TURNS: "8"
          DUFYND_JARVIS_MAX_BUDGET_USD: "0.25"
          DUFYND_JARVIS_BUDGET_ID: "jarvis_activation_pilot_001"
          DUFYND_JARVIS_ACTIVE: "1"
        run: >-
          python -m scripts.dufynd_jarvis_runtime
          --autonomous-cycle
          --autonomous-max-events "2"

      - name: Run read-only Jarvis safe worker
        if: inputs.mode == 'process-safe-task'
        env:
          SUPABASE_URL: "https://bqsdxaagklpkxioaqdqa.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUFYND_JARVIS_MODEL: ${{ vars.DUFYND_JARVIS_MODEL }}
          DUFYND_JARVIS_MAX_TURNS: "8"
          DUFYND_JARVIS_MAX_BUDGET_USD: "0.25"
          DUFYND_JARVIS_BUDGET_ID: "jarvis_activation_pilot_001"
          DUFYND_JARVIS_ACTIVE: "1"
        run: python -m scripts.dufynd_jarvis_runtime --process-safe-task

      - name: Set up Node for branch-worker web validation
        if: inputs.mode == 'process-branch-task'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json

      - name: Run isolated Jarvis branch worker
        if: inputs.mode == 'process-branch-task'
        env:
          SUPABASE_URL: "https://bqsdxaagklpkxioaqdqa.supabase.co"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUFYND_JARVIS_MODEL: ${{ vars.DUFYND_JARVIS_MODEL }}
          DUFYND_JARVIS_MAX_TURNS: "8"
          DUFYND_JARVIS_MAX_BUDGET_USD: "0.25"
          DUFYND_JARVIS_BUDGET_ID: "jarvis_activation_pilot_001"
          DUFYND_JARVIS_ACTIVE: "1"
        run: python -m scripts.dufynd_jarvis_runtime --process-branch-task

      - name: Validate isolated Jarvis patch
        if: inputs.mode == 'process-branch-task'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only > jarvis-worker-files.txt

          if [ ! -s jarvis-worker-files.txt ]; then
            echo "Jarvis branch worker produced no repository changes."
            exit 0
          fi

          while IFS= read -r file; do
            case "$file" in
              .github/*|examples/retail/data/*|supabase/*|*.env|*.env.*|*package-lock.json|*pnpm-lock.yaml|*yarn.lock|requirements*.txt|pyproject.toml)
                echo "Blocked Jarvis branch-worker path: $file"
                exit 21
                ;;
              scripts/*.py|tests/*.py|docs/*|examples/retail/api/*.py|examples/retail/api/*|examples/retail/storefront-web/app/*|examples/retail/storefront-web/components/*|examples/retail/storefront-web/lib/*|examples/retail/storefront-web/scripts/*)
                ;;
              *)
                echo "Path is outside Jarvis branch-worker allowlist: $file"
                exit 22
                ;;
            esac
          done < jarvis-worker-files.txt

          git diff --binary > jarvis-worker.patch
          ruff check .
          ruff format --check .
          pytest -q
          python scripts/check.py

          if grep -q '^examples/retail/storefront-web/' jarvis-worker-files.txt; then
            echo "Storefront changes detected; running deterministic web and visual QA."
            pushd examples > /dev/null
            npm ci
            npm install --no-save playwright@1.55.0
            npx playwright install --with-deps chromium
            npm run build --workspace acme-retail-storefront-web

            node retail/storefront-web/scripts/serve-static-export.mjs               --root retail/storefront-web/out               --port 3000 > /tmp/dufynd-jarvis-static.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT

            for attempt in {1..60}; do
              if curl --fail --silent --location                 http://127.0.0.1:3000/duft/xerjoff-naxos > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                cat /tmp/dufynd-jarvis-static.log
                exit 24
              fi
              sleep 1
            done

            node retail/storefront-web/scripts/dufynd-visual-qa.mjs               --base-url http://127.0.0.1:3000               --out retail/storefront-web/.visual-qa
            popd > /dev/null
          fi

      - name: Upload isolated Jarvis patch
        if: inputs.mode == 'process-branch-task' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dufynd-jarvis-worker-patch-${{ github.run_id }}
          path: |
            jarvis-worker.patch
            jarvis-worker-files.txt
            examples/retail/storefront-web/.visual-qa
          if-no-files-found: warn
          retention-days: 7
