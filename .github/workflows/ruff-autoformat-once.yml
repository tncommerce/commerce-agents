name: One-time Ruff Autoformat

on:
  push:
    branches:
      - scentai-mvp
    paths:
      - .github/workflows/ruff-autoformat-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scentai-mvp
        uses: actions/checkout@v4
        with:
          ref: scentai-mvp
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.3

      - name: Format Python sources
        run: ruff format .

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Python sources with Ruff 0.16.3"
          git push origin HEAD:scentai-mvp
