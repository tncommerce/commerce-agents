name: Temporary DUFYND Derived State Refresh

on:
  push:
    branches:
      - dufynd-catalog-expansion-wave2-20260925
    paths:
      - ".github/workflows/dufynd-derived-state-refresh-temp.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Preserve canonical generated timestamp
        id: generated
        shell: bash
        run: |
          value="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path("examples/retail/data/scentai_jarvis_operations_status.json").read_text(
                  encoding="utf-8-sig"
              )
          )
          print(payload["generated_at"])
          PY
          )"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Refresh derived Jarvis state
        env:
          PYTHONPATH: .
        run: >-
          python scripts/refresh_scentai_jarvis_state.py
          --write
          --generated-at "${{ steps.generated.outputs.value }}"
      - name: Commit derived state only
        shell: bash
        run: |
          git add \
            examples/retail/data/scentai_merchant_mapping_work_queue.json \
            examples/retail/data/scentai_affiliate_activation_status.json \
            examples/retail/data/scentai_image_approval_work_queue.json \
            examples/retail/data/scentai_release_01_feed_activation_queue.json \
            examples/retail/data/scentai_release_01_gate_status.json \
            examples/retail/data/scentai_release_pipeline_status.json \
            examples/retail/data/scentai_jarvis_operations_status.json \
            examples/retail/data/scentai_content_operations_status.json \
            examples/retail/data/scentai_content_operations_status_batch02.json \
            examples/retail/data/scentai_content_operations_status_batch03.json \
            examples/retail/data/scentai_content_pipeline_status.json \
            examples/retail/data/scentai_media_generation_queue.json \
            examples/retail/data/scentai_jarvis_master_status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh DUFYND catalog-derived state [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
