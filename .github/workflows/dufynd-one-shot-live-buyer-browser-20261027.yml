name: DUFYND One-Shot Real Buyer Browser QA
on:
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-one-shot-live-buyer-browser-20261027.yml]
permissions:
  contents: read
jobs:
  real-buyers-without-clickouts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - name: Install only existing locked browser prerequisites
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Read ten public product journeys without analytics or clickouts
        run: node retail/storefront-web/scripts/dufynd-live-buyer-browser-qa-20261027.mjs
