name: DUFYND Temporary State Refresh

on:
  push:
    branches:
      - dufynd-top-parfuemerie-awin-feed

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dufynd-top-parfuemerie-awin-feed

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Refresh derived DUFYND state and capture diagnostics
        shell: bash
        run: |
          set +e
          python -m scripts.refresh_scentai_jarvis_state --write --generated-at "2026-09-22T19:50:00+00:00" > .tmp-dufynd-refresh.log 2>&1
          code=$?
          echo "exit_code=$code" >> .tmp-dufynd-refresh.log
          cat .tmp-dufynd-refresh.log
          exit 0

      - name: Commit refreshed state or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-dufynd-refresh.log
          for f in             examples/retail/data/scentai_merchant_mapping_work_queue.json             examples/retail/data/scentai_affiliate_activation_status.json             examples/retail/data/scentai_image_approval_work_queue.json             examples/retail/data/scentai_release_01_feed_activation_queue.json             examples/retail/data/scentai_release_01_gate_status.json             examples/retail/data/scentai_release_pipeline_status.json             examples/retail/data/scentai_jarvis_operations_status.json             examples/retail/data/scentai_content_operations_status.json             examples/retail/data/scentai_content_operations_status_batch02.json             examples/retail/data/scentai_content_operations_status_batch03.json             examples/retail/data/scentai_content_pipeline_status.json             examples/retail/data/scentai_media_generation_queue.json             examples/retail/data/scentai_jarvis_master_status.json
          do
            test -e "$f" && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No state or diagnostic changes."
            exit 0
          fi
          git commit -m "Capture DUFYND state refresh result"
          git push origin HEAD:dufynd-top-parfuemerie-awin-feed
