name: DUFYND Private Observer Watchdog

on:
  workflow_dispatch:
  # Independent scheduler identity for the Private Observer. This is intentionally
  # separate from dufynd-private-observer.yml so a workflow-specific schedule
  # registration failure cannot stop all autonomous observer refreshes.
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: dufynd-private-observer-watchdog-main
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch trusted Private Observer on scentai-mvp
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run dufynd-private-observer.yml
          --repo "${GITHUB_REPOSITORY}"
          --ref scentai-mvp
