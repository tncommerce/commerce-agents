name: DUFYND Private Observer Watchdog

on:
  workflow_dispatch:
  # Independent scheduler identity for the Private Observer. This is intentionally
  # separate from dufynd-private-observer.yml so a workflow-specific schedule
  # registration failure cannot stop all autonomous observer refreshes.
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  # Serialize main observer and watchdog checks; the target branch has its own group.
  group: dufynd-private-observer-main
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject a recent duplicate observer dispatch
        id: cooldown
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dufynd_native_observer_dispatch_dedupe.py
      - name: Dispatch trusted Private Observer on scentai-mvp
        if: steps.cooldown.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DUFYND_PRIVATE_BROKER_ENABLED: ${{ vars.DUFYND_PRIVATE_BROKER_ENABLED }}
          DUFYND_PRIVATE_RENDER_SERVICES_V2_ENABLED: ${{ vars.DUFYND_PRIVATE_RENDER_SERVICES_V2_ENABLED }}
          DUFYND_PRIVATE_RENDER_SERVICES_V2_AUTO_ENABLED: ${{ vars.DUFYND_PRIVATE_RENDER_SERVICES_V2_AUTO_ENABLED }}
        run: |
          set -euo pipefail
          mode=render
          capture_v2=false
          if [[ "${DUFYND_PRIVATE_BROKER_ENABLED}" == "1" &&
                "${DUFYND_PRIVATE_RENDER_SERVICES_V2_ENABLED}" == "1" &&
                "${DUFYND_PRIVATE_RENDER_SERVICES_V2_AUTO_ENABLED}" == "1" ]]; then
            mode=render_services_v2
            capture_v2=true
          fi
          gh workflow run dufynd-private-observer.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref scentai-mvp \
            -f "mode=${mode}" \
            -f "capture_v2=${capture_v2}"
