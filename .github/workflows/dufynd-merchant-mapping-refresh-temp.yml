name: DUFYND Merchant Mapping Temporary Refresh

on:
  push:
    branches:
      - dufynd-merchant-mapping-policy-20260926

permissions:
  contents: write

concurrency:
  group: dufynd-merchant-mapping-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip-merchant-mapping-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dufynd-merchant-mapping-policy-20260926
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install repository Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Refresh derived DUFYND state
        run: PYTHONPATH=examples python -m scripts.refresh_scentai_jarvis_state --write --generated-at "2026-09-26T14:45:00+00:00"

      - name: Commit regenerated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/data
          if git diff --cached --quiet; then
            echo "No regenerated state changes."
            exit 0
          fi
          git commit -m "Refresh DUFYND merchant mapping state [skip-merchant-mapping-refresh]"
          git push origin HEAD:dufynd-merchant-mapping-policy-20260926
