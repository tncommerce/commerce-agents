name: DUFYND Naxos Backdrop Repair

on:
  push:
    branches:
      - dufynd-naxos-master-integrity-20260924
    paths:
      - .github/workflows/dufynd-naxos-backdrop-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: dufynd-naxos-master-integrity-20260924

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"

      - name: Rebuild and verify Naxos campaign backdrop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path.cwd()
          source = root / "examples/retail/storefront-web/public/products/pilot/xerjoff-naxos-editorial.png"
          target = root / "examples/retail/storefront-web/public/products/pilot/xerjoff-naxos-campaign-master.webp"

          with Image.open(source) as source_image:
              image = source_image.convert("RGB")
              width, height = image.size
              target_ratio = 900 / 507
              crop_height = min(height, round(width / target_ratio))
              y0 = max(0, min(height - crop_height, 190))
              image = image.crop((0, y0, width, y0 + crop_height))
              image = image.resize((900, 507), Image.Resampling.LANCZOS)
              image.save(target, "WEBP", quality=90, method=6)

          data = target.read_bytes()
          assert data[:4] == b"RIFF"
          assert data[8:12] == b"WEBP"
          assert int.from_bytes(data[4:8], "little") + 8 == len(data)

          with Image.open(target) as verified:
              verified.load()
              assert verified.format == "WEBP"
              assert verified.size == (900, 507)

          print(f"Repaired {target}: {len(data)} bytes")
          PY

      - name: Refresh provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("examples/retail/storefront-web/public/products/IMAGE-CREDITS.md")
          text = path.read_text(encoding="utf-8")
          old = "| `pilot/xerjoff-naxos-campaign-master.webp` | Xerjoff Naxos | AI-assisted DUFYND campaign artwork, approved 2026-09-24 | Homepage spotlight and fragrance detail hero |"
          new = "| `pilot/xerjoff-naxos-campaign-master.webp` | Xerjoff Naxos | DUFYND layered backdrop rebuilt from the approved Naxos editorial master after transfer-integrity repair, 2026-09-24 | Homepage spotlight backdrop and legacy preview media |"
          if old not in text:
              raise SystemExit("Expected Naxos provenance row not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dufynd-naxos-backdrop-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             examples/retail/storefront-web/public/products/pilot/xerjoff-naxos-campaign-master.webp             examples/retail/storefront-web/public/products/IMAGE-CREDITS.md             .github/workflows/dufynd-naxos-backdrop-repair.yml
          git commit -m "Repair Naxos campaign backdrop integrity"
          git push origin HEAD:dufynd-naxos-master-integrity-20260924
