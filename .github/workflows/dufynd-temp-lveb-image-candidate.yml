name: DUFYND Temporary LVEB Image Candidate Intake

on:
  push:
    branches:
      - dufynd-lveb-rights-cleared-image-candidate-20260927

permissions:
  contents: write

concurrency:
  group: dufynd-temp-lveb-image-candidate-intake
  cancel-in-progress: false

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ".:examples"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dufynd-lveb-rights-cleared-image-candidate-20260927

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Register rights-cleared candidate
        shell: bash
        run: |
          python -m scripts.register_scentai_rights_cleared_image \
            --product-id SC-LANCOME-LA-VIE-EST-BELLE-EDP-100 \
            --image-url https://fooddrinkssuppliers.com/media/cosmetics/3605533286555.webp \
            --source-class licensed_asset_provider \
            --rights-basis-id open-beauty-facts-3605533286555-cc-by-sa-3.0 \
            --rights-checked-at 2026-09-27 \
            --license-name "CC BY-SA 3.0" \
            --license-url https://creativecommons.org/licenses/by-sa/3.0/ \
            --attribution-text "Open Beauty Facts contributors" \
            --share-alike-required \
            --exact-variant-verified \
            --commercial-use-allowed \
            --public-distribution-allowed \
            --evidence-note "Exact 100 ml variant and GTIN 3605533286555 confirmed at https://fooddrinkssuppliers.com/cosmetics-personal-care/lancome-la-vie-est-belle-edp-kad-n-parfum/ . Photograph credits identify the image as Open Beauty Facts contributors under CC BY-SA 3.0 at https://fooddrinkssuppliers.com/photograph-credits/ ." \
            --write \
            --machine-readable

      - name: Validate human review packet
        run: python -m scripts.build_scentai_rights_cleared_image_review_packet --machine-readable

      - name: Commit candidate queue
        shell: bash
        run: |
          set -euo pipefail
          git add examples/retail/data/dufynd_rights_cleared_image_candidates.json
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DUFYND: register La Vie est Belle rights-cleared image candidate [skip ci]"
          git push origin HEAD:dufynd-lveb-rights-cleared-image-candidate-20260927
