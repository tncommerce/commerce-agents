name: DUFYND Private Observer Read
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: dufynd-private-observer
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/scentai-mvp' && vars.DUFYND_PRIVATE_BROKER_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Fixed read only; no upstream or management credentials
        env:
          BROKER_ORIGIN: ${{ vars.DUFYND_PRIVATE_BROKER_ORIGIN }}
        run: python -m private_broker.observer_read
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-observer-filtered-${{ github.run_id }}
          path: broker-observations.json
          retention-days: 1
