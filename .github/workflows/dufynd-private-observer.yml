name: DUFYND Private Observer Read
on:
  workflow_dispatch:
  # Scheduler registration refresh 2026-10-07: GitHub stopped emitting new
  # schedule events after the previous cron update. Move the same staggered
  # five-minute cadence to new minute slots so the default-branch scheduler
  # re-registers the workflow without changing the trusted dispatch boundary.
  # The scentai-mvp observer remains idempotent and provenance-bound.
  schedule:
    - cron: "1,11,21,31,41,51 * * * *"
    - cron: "6,16,26,36,46,56 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: dufynd-private-observer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  scheduled-dispatch:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch accepted observer workflow on scentai-mvp
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run dufynd-private-observer.yml
          --repo "${GITHUB_REPOSITORY}"
          --ref scentai-mvp

  read:
    if: github.ref == 'refs/heads/scentai-mvp' && vars.DUFYND_PRIVATE_BROKER_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Fixed read only; no upstream or management credentials
        env:
          BROKER_ORIGIN: ${{ vars.DUFYND_PRIVATE_BROKER_ORIGIN }}
        run: python private_broker/observer_read.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-observer-filtered-${{ github.run_id }}
          path: broker-observations.json
          retention-days: 1
