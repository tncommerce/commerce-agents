name: DUFYND Awin Feed Revalidation

on:
  workflow_dispatch:
  # One-off development copy; do not merge this trigger into production.
  # The production branch retains its existing recipient-rotation trigger.
  push:
    branches: [dev/dufynd-products-20261026]
    paths: [.github/workflows/dufynd-awin-feed-revalidation.yml]

permissions:
  contents: read

jobs:
  # One source refresh for *previously unreviewed staging products* on an isolated branch. No paid
  # runner, dependency install, cache, artifact, clickout or deployment.
  review-next-public-photo-gaps:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/dev/dufynd-products-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify unchanged bytes of four official Awin original images
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_dufynd_staging_original_image_bytes.py --self-test
          python3 scripts/verify_dufynd_staging_original_image_bytes.py

  revalidate-top-parfuemerie:
    if: ${{ github.ref != 'refs/heads/dev/dufynd-products-20261026' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Require Awin data-feed secret
        shell: bash
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWIN_DATA_FEED_API_KEY:-}" ]; then
            echo "::error::Repository secret AWIN_DATA_FEED_API_KEY is not configured."
            exit 2
          fi

      - name: Download current top Parfümerie feed
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        run: |
          python scripts/fetch_dufynd_awin_data_feed.py \
            --advertiser-id 31081 \
            --feed-id 91379 \
            --output "${RUNNER_TEMP}/top-parfuemerie.csv" \
            --report "${RUNNER_TEMP}/awin-feed-metadata.json"

      - name: Encrypt bounded four-row evidence
        if: ${{ github.ref == 'refs/heads/scentai-mvp' }}
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        run: |
          python scripts/export_dufynd_awin_four_rows.py \
            --feed "${RUNNER_TEMP}/top-parfuemerie.csv" \
            --recipient .github/dufynd-awin-evidence-recipient.pub \
            --output "${RUNNER_TEMP}/four-row-evidence.encrypted.json"

      - name: Upload recipient-encrypted evidence only
        if: ${{ github.ref == 'refs/heads/scentai-mvp' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dufynd-awin-four-row-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/four-row-evidence.encrypted.json
          if-no-files-found: error
          retention-days: 1

      - name: Check Release 01 against current feed
        id: release_check
        shell: bash
        run: |
          set +e
          python scripts/check_scentai_release_feed.py \
            --feed "${RUNNER_TEMP}/top-parfuemerie.csv" \
            --provider-config examples/retail/data/dufynd_awin_top_parfuemerie_provider_config.json \
            --machine-readable > "${RUNNER_TEMP}/release-readiness.json"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 20 ]; then
            echo "::warning::Current Awin feed is not release/import ready; continuing only through the independently guarded human image-review path."
          elif [ "$status" -ne 0 ] && [ "$status" -ne 10 ]; then
            exit "$status"
          fi

      - name: Extract review-only image candidates
        run: |
          PYTHONPATH=examples python -m retail.api.extract_merchant_feed_assets \
            --feed "${RUNNER_TEMP}/top-parfuemerie.csv" \
            --provider-config examples/retail/data/dufynd_awin_top_parfuemerie_provider_config.json \
            --output "${RUNNER_TEMP}/merchant-feed-image-candidates.json"

      - name: Prepare Release 01 feed-image review candidates
        run: |
          python scripts/prepare_scentai_feed_image_review.py \
            --candidates "${RUNNER_TEMP}/merchant-feed-image-candidates.json" \
            --feed-metadata "${RUNNER_TEMP}/awin-feed-metadata.json" \
            --output "${RUNNER_TEMP}/release01-feed-image-review-candidates.json"

      - name: Render visual image review packet
        run: |
          python scripts/render_scentai_feed_image_review_html.py \
            --candidates "${RUNNER_TEMP}/release01-feed-image-review-candidates.json" \
            --output "${RUNNER_TEMP}/release01-feed-image-review.html"

      # High-confidence path: only prior independently mapped exact merchant SKU.
      - name: Review exact mapped public photo gaps (no approval)
        run: |
          python scripts/prepare_dufynd_catalog_photo_wave.py \
            --extracted-candidates "${RUNNER_TEMP}/merchant-feed-image-candidates.json" \
            --feed-metadata "${RUNNER_TEMP}/awin-feed-metadata.json" \
            --output "${RUNNER_TEMP}/public-photo-exact-sku-review.json"
      # Source-bounded lead discovery; never mutates approvals or offers.
      - name: Prepare 33 public missing-photo review leads
        run: |
          python scripts/report_dufynd_public_photo_feed_leads.py \
            --feed "${RUNNER_TEMP}/top-parfuemerie.csv" \
            --feed-metadata "${RUNNER_TEMP}/awin-feed-metadata.json" \
            --gap docs/dufynd-catalog-photo-gap-20261011.json \
            --output "${RUNNER_TEMP}/public-photo-gap-review.json"
      - name: Render prioritized public-photo contact sheet (review-only)
        run: |
          python scripts/render_dufynd_public_photo_review_html.py \
            --candidates "${RUNNER_TEMP}/public-photo-gap-review.json" \
            --output "${RUNNER_TEMP}/public-photo-gap-review.html"
      # Strict second gate: only historical exact SKU+GTIN mappings can become
      # candidate image leads. Human identity, bytes and owner GO still required.
      - name: Gate mapped public packshots against current feed
        run: |
          python scripts/prepare_dufynd_catalog_photo_wave.py \
            --extracted-candidates "${RUNNER_TEMP}/merchant-feed-image-candidates.json" \
            --feed-metadata "${RUNNER_TEMP}/awin-feed-metadata.json" \
            --output "${RUNNER_TEMP}/public-photo-strict-variant-review.json"

      - name: Upload sanitized review packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dufynd-awin-top-parfuemerie-review-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/awin-feed-metadata.json
            ${{ runner.temp }}/release-readiness.json
            ${{ runner.temp }}/release01-feed-image-review-candidates.json
            ${{ runner.temp }}/release01-feed-image-review.html
            ${{ runner.temp }}/public-photo-exact-sku-review.json
            ${{ runner.temp }}/public-photo-gap-review.json
            ${{ runner.temp }}/public-photo-gap-review.html
            ${{ runner.temp }}/public-photo-strict-variant-review.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve blocked Release 01 result after review artifact
        if: ${{ steps.release_check.outputs.status == '20' }}
        shell: bash
        run: |
          echo "::error::Current Awin feed remains structurally blocked for Release 01 activation. Review artifact was generated for human image review only."
          exit 20
