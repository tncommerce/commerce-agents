name: DUFYND Awin Feed Revalidation

on:
  workflow_dispatch:
  push:
    branches:
      - dufynd-awin-feed-revalidation-run-20260930

permissions:
  contents: read

jobs:
  revalidate-top-parfuemerie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Require Awin data-feed secret
        shell: bash
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWIN_DATA_FEED_API_KEY:-}" ]; then
            echo "::error::Repository secret AWIN_DATA_FEED_API_KEY is not configured."
            exit 2
          fi

      - name: Download current top Parfümerie feed
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        run: |
          python scripts/fetch_dufynd_awin_data_feed.py \
            --advertiser-id 31081 \
            --feed-id 91379 \
            --output "${RUNNER_TEMP}/top-parfuemerie.csv" \
            --report "${RUNNER_TEMP}/awin-feed-metadata.json"

      - name: Diagnose sanitized provider-contract failures
        run: |
          PYTHONPATH=examples python - <<'PY'
          import json
          from pathlib import Path

          from pydantic import ValidationError
          from retail.api.merchant_feed_reader import read_merchant_feed_rows
          from retail.api.merchant_provider_contract import MerchantProviderCanonicalRow
          from retail.api.merchant_providers import load_mapped_provider_adapter

          import os
          feed = Path(os.environ["RUNNER_TEMP"]) / "top-parfuemerie.csv"
          config = Path(
              "examples/retail/data/dufynd_awin_top_parfuemerie_provider_config.json"
          )
          rows = read_merchant_feed_rows(feed)
          adapter = load_mapped_provider_adapter(config)
          availability_headers = sorted(
              key
              for key in rows[0]
              if any(token in key.casefold() for token in ("stock", "avail"))
          )
          availability_samples = {
              key: sorted({str(row.get(key, "")) for row in rows[:10]})
              for key in availability_headers
          }
          print(
              json.dumps(
                  {
                      "availability_headers": availability_headers,
                      "availability_samples": availability_samples,
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          diagnostics = []
          for index, raw in enumerate(rows[:5]):
              adapted = adapter.adapt_row(raw)
              try:
                  MerchantProviderCanonicalRow.model_validate(adapted)
              except ValidationError as exc:
                  diagnostics.append(
                      {
                          "row_index": index,
                          "adapted_keys": sorted(adapted),
                          "errors": [
                              {
                                  "loc": list(error["loc"]),
                                  "type": error["type"],
                                  "msg": error["msg"],
                              }
                              for error in exc.errors(
                                  include_url=False,
                                  include_input=False,
                              )
                          ],
                      }
                  )
          print(json.dumps(diagnostics, ensure_ascii=False, sort_keys=True))
          PY

      - name: Check Release 01 against current feed
        shell: bash
        run: |
          set +e
          python scripts/check_scentai_release_feed.py \
            --feed "${RUNNER_TEMP}/top-parfuemerie.csv" \
            --provider-config examples/retail/data/dufynd_awin_top_parfuemerie_provider_config.json \
            --machine-readable > "${RUNNER_TEMP}/release-readiness.json"
          status=$?
          set -e
          cat "${RUNNER_TEMP}/release-readiness.json"
          if [ "$status" -eq 20 ]; then
            echo "::error::Current Awin feed is structurally blocked."
            exit 20
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 10 ]; then
            exit "$status"
          fi

      - name: Extract review-only image candidates
        run: |
          PYTHONPATH=examples python -m retail.api.extract_merchant_feed_assets \
            --feed "${RUNNER_TEMP}/top-parfuemerie.csv" \
            --provider-config examples/retail/data/dufynd_awin_top_parfuemerie_provider_config.json \
            --output "${RUNNER_TEMP}/merchant-feed-image-candidates.json"

      - name: Prepare Release 01 feed-image review candidates
        run: |
          python scripts/prepare_scentai_feed_image_review.py \
            --candidates "${RUNNER_TEMP}/merchant-feed-image-candidates.json" \
            --feed-metadata "${RUNNER_TEMP}/awin-feed-metadata.json" \
            --output "${RUNNER_TEMP}/release01-feed-image-review-candidates.json"

      - name: Render visual image review packet
        run: |
          python scripts/render_scentai_feed_image_review_html.py \
            --candidates "${RUNNER_TEMP}/release01-feed-image-review-candidates.json" \
            --output "${RUNNER_TEMP}/release01-feed-image-review.html"

      - name: Upload sanitized review packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dufynd-awin-top-parfuemerie-review-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/awin-feed-metadata.json
            ${{ runner.temp }}/release-readiness.json
            ${{ runner.temp }}/release01-feed-image-review-candidates.json
            ${{ runner.temp }}/release01-feed-image-review.html
          if-no-files-found: error
          retention-days: 7
