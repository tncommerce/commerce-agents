name: DUFYND Awin Feed Revalidation

# GitHub requires a workflow_dispatch entry on the default branch before the
# Actions UI can offer "Run workflow" for the reviewed scentai-mvp version.
# This file only registers that entry. All inventory reads remain on scentai-mvp.
on:
  workflow_dispatch:
    inputs:
      inventory_task:
        description: "Select branch scentai-mvp for this review-only inventory"
        required: true
        type: choice
        default: perfumetrader_inventory
        options:
          - perfumetrader_inventory
          - top_parfuemerie_review
          - perfumetrader_private_catalog

permissions: {}

jobs:
  require-reviewed-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse inventory execution from this registration-only branch
        shell: bash
        run: |
          echo "::error::Select branch scentai-mvp and an explicitly chosen inventory_task; this default-branch workflow is registration-only."
          exit 2
