name: DUFYND Awin Feed Revalidation

on:
  workflow_dispatch:
  push:
    branches:
      - dufynd-awin-feed-revalidation-run-20260930

permissions:
  contents: read

jobs:
  probe-top-parfuemerie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require Awin data-feed secret
        shell: bash
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWIN_DATA_FEED_API_KEY:-}" ]; then
            echo "::error::Repository secret AWIN_DATA_FEED_API_KEY is not configured."
            exit 2
          fi

      - name: Probe sanitized top Parfümerie feed metadata
        env:
          AWIN_DATA_FEED_API_KEY: ${{ secrets.AWIN_DATA_FEED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import quote

          from scripts.fetch_dufynd_awin_data_feed import (
              DEFAULT_LIST_MAX_BYTES,
              _read_url,
              find_feed,
              parse_feed_list,
              sanitized_feed_metadata,
          )

          api_key = os.environ["AWIN_DATA_FEED_API_KEY"].strip()
          list_url = (
              "https://productdata.awin.com/datafeed/list/apikey/"
              + quote(api_key, safe="")
          )
          rows = parse_feed_list(
              _read_url(list_url, max_bytes=DEFAULT_LIST_MAX_BYTES),
              max_bytes=DEFAULT_LIST_MAX_BYTES,
          )
          row = find_feed(rows, advertiser_id="31081", feed_id="91379")
          metadata = sanitized_feed_metadata(row)
          print(json.dumps(metadata, ensure_ascii=False, sort_keys=True))
          PY
