name: One-time SCENTAI State Refresh

on:
  push:
    branches:
      - scentai-mvp
    paths:
      - .github/workflows/refresh-scentai-state-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scentai-mvp
        uses: actions/checkout@v4
        with:
          ref: scentai-mvp
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Refresh derived SCENTAI state
        run: PYTHONPATH=. python -m scripts.refresh_scentai_jarvis_state --write --generated-at 2026-09-19T21:45:00+00:00

      - name: Validate refreshed state
        run: python scripts/check.py

      - name: Commit refreshed state
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No state changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/data/scentai_*.json
          git commit -m "Refresh SCENTAI derived state after DUFYND social cutover"
          git push origin HEAD:scentai-mvp
