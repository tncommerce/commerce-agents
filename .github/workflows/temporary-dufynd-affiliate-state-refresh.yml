name: Temporary DUFYND Affiliate State Refresh

on:
  push:
    branches:
      - dufynd-affiliate-state-reconcile-20260922

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: dufynd-affiliate-state-reconcile-20260922
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh deterministic Jarvis state
        run: |
          python scripts/refresh_scentai_jarvis_state.py \
            --write \
            --generated-at "2026-09-21T21:18:43+00:00"
      - name: Commit derived state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/data/scentai_affiliate_activation_status.json
          git add examples/retail/data/scentai_release_01_gate_status.json
          git add examples/retail/data/scentai_release_pipeline_status.json
          git add examples/retail/data/scentai_jarvis_operations_status.json
          git add examples/retail/data/scentai_jarvis_master_status.json
          if git diff --cached --quiet; then
            echo "No derived-state changes."
            exit 0
          fi
          git commit -m "Refresh DUFYND affiliate-derived state [skip ci]"
          git push origin HEAD:dufynd-affiliate-state-reconcile-20260922
