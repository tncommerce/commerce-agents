name: DUFYND Perfumetrader Live Smoke

on:
  push:
    branches:
      - dufynd-live-smoke-perfumetrader-20260921

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live API to expose Perfumetrader
        shell: bash
        run: |
          set -euo pipefail
          API="https://scentai-api-kxhe.onrender.com"
          for i in $(seq 1 18); do
            body="$(curl -fsS --max-time 20 "$API/api/merchant-partners" || true)"
            if printf '%s' "$body" | grep -q '"merchant_id":"perfumetrader"'; then
              echo "Perfumetrader is live in merchant partner API."
              printf '%s
' "$body"
              exit 0
            fi
            echo "Attempt $i/18: Perfumetrader not live yet."
            sleep 20
          done
          echo "Perfumetrader did not appear within the deployment wait window."
          exit 1

      - name: Verify DUFYND partner clickout redirects to verified Awin link
        shell: bash
        run: |
          set -euo pipefail
          API="https://scentai-api-kxhe.onrender.com"
          URL="$API/api/merchant-partners/perfumetrader/clickout?src=organic&cmp=perfumetrader_live_smoke&content=partner_activation_001&sid=perfumetrader-live-smoke-001"
          status="$(curl -sS --max-time 20 -o /dev/null -D /tmp/headers.txt -w '%{http_code}' "$URL")"
          echo "status=$status"
          cat /tmp/headers.txt
          test "$status" = "302"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {$1=""; sub(/^ /,""); gsub(//,""); print; exit}' /tmp/headers.txt)"
          echo "location=$location"
          printf '%s' "$location" | grep -q 'awin1.com/cread.php'
          printf '%s' "$location" | grep -q 'awinmid=11672'
          printf '%s' "$location" | grep -q 'awinaffid=3099222'

      - name: Verify DUFYND storefront responds
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -LsS --max-time 30 -o /tmp/dufynd.html -w '%{http_code}' https://dufynd.de/)"
          echo "status=$status"
          test "$status" = "200"
          grep -q 'DUFYND' /tmp/dufynd.html
          echo "DUFYND storefront live."

      - name: Optional Awin onward redirect probe
        shell: bash
        run: |
          set +e
          final="$(curl -LsS --max-time 30 -o /dev/null -w '%{url_effective}|%{http_code}'             'https://scentai-api-kxhe.onrender.com/api/merchant-partners/perfumetrader/clickout?src=organic&cmp=perfumetrader_live_smoke&content=partner_activation_001&sid=perfumetrader-live-smoke-002')"
          code=$?
          echo "curl_exit=$code"
          echo "final=$final"
          exit 0
