name: Temporary DUFYND State Refresh

on:
  push:
    branches: [dufynd-state-correctness-v2-20260920]
    paths:
      - ".github/dufynd-state-refresh.trigger"

permissions:
  contents: write

concurrency:
  group: dufynd-state-refresh-v2
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: dufynd-state-correctness-v2-20260920
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh derived DUFYND state
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          PYTHONPATH=. python -m scripts.refresh_scentai_jarvis_state             --write             --generated-at "$generated_at"
          PYTHONPATH=. python -m scripts.validate_scentai_jarvis_state_graph

      - name: Commit refreshed state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             examples/retail/data/scentai_merchant_mapping_work_queue.json             examples/retail/data/scentai_affiliate_activation_status.json             examples/retail/data/scentai_image_approval_work_queue.json             examples/retail/data/scentai_release_01_feed_activation_queue.json             examples/retail/data/scentai_release_01_gate_status.json             examples/retail/data/scentai_release_pipeline_status.json             examples/retail/data/scentai_jarvis_operations_status.json             examples/retail/data/scentai_content_operations_status.json             examples/retail/data/scentai_content_operations_status_batch02.json             examples/retail/data/scentai_content_operations_status_batch03.json             examples/retail/data/scentai_content_pipeline_status.json             examples/retail/data/scentai_media_generation_queue.json             examples/retail/data/scentai_jarvis_master_status.json

          if git diff --cached --quiet; then
            echo "No derived-state changes to commit."
            exit 0
          fi

          git commit -m "Refresh DUFYND derived state for state-correctness PR"
          git push origin HEAD:dufynd-state-correctness-v2-20260920
