name: DUFYND Naxos Cutout Transparency Fix

on:
  push:
    branches:
      - dufynd-offers-3d-look-20260924

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dufynd-offers-3d-look-20260924

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove only border-connected neutral background
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path

          path=Path("examples/retail/storefront-web/public/products/naxos-cutout-production.png")
          im=Image.open(path).convert("RGBA")
          w,h=im.size
          px=im.load()

          corners=[
              px[0,0][:3],px[w-1,0][:3],px[0,h-1][:3],px[w-1,h-1][:3]
          ]
          seed=tuple(sum(c[i] for c in corners)/len(corners) for i in range(3))
          print("size",w,h,"corners",corners,"seed",seed)

          def bg_like(rgb):
              r,g,b=rgb
              # Background is a near-neutral studio white/gray.
              # Restrict to bright low-chroma pixels so gold/glass detail is preserved.
              brightness=(r+g+b)/3
              chroma=max(r,g,b)-min(r,g,b)
              dist=sum((rgb[i]-seed[i])**2 for i in range(3))**0.5
              return brightness >= 218 and chroma <= 28 and dist <= 72

          seen=bytearray(w*h)
          q=deque()
          def push(x,y):
              idx=y*w+x
              if seen[idx]:
                  return
              seen[idx]=1
              if bg_like(px[x,y][:3]):
                  q.append((x,y))

          for x in range(w):
              push(x,0); push(x,h-1)
          for y in range(h):
              push(0,y); push(w-1,y)

          removed=0
          while q:
              x,y=q.popleft()
              r,g,b,a=px[x,y]
              px[x,y]=(r,g,b,0)
              removed+=1
              if x: push(x-1,y)
              if x+1<w: push(x+1,y)
              if y: push(x,y-1)
              if y+1<h: push(x,y+1)

          # Keep original RGB under transparency; browsers then get clean antialiasing.
          im.save(path,optimize=True)

          # QA metrics: corners must be transparent, center bottle must remain opaque.
          check=Image.open(path).convert("RGBA")
          alpha=check.getchannel("A")
          vals=list(alpha.getdata())
          transparent=sum(1 for a in vals if a==0)
          opaque=sum(1 for a in vals if a>=250)
          print("removed",removed,"transparent",transparent,"opaque",opaque,
                "corner_alpha",[check.getpixel(p)[3] for p in [(0,0),(w-1,0),(0,h-1),(w-1,h-1)]],
                "center_alpha",check.getpixel((w//2,h//2))[3])
          assert all(check.getpixel(p)[3]==0 for p in [(0,0),(w-1,0),(0,h-1),(w-1,h-1)])
          assert check.getpixel((w//2,h//2))[3] >= 240
          assert transparent > (w*h)*0.20
          assert opaque > (w*h)*0.10
          PY

      - name: Commit corrected transparent cutout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/retail/storefront-web/public/products/naxos-cutout-production.png
          if git diff --cached --quiet; then
            echo "No image changes detected."
            exit 0
          fi
          git commit -m "Make Naxos production cutout truly transparent"
          git push origin HEAD:dufynd-offers-3d-look-20260924
