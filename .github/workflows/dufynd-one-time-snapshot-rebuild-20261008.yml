name: DUFYND One-Time Snapshot Rebuild
on:
  push:
    branches:
      - dufynd-reconcile-approved-image-gates-20261008
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'tncommerce/commerce-agents' && github.ref == 'refs/heads/dufynd-reconcile-approved-image-gates-20261008' && !contains(github.event.head_commit.message, '[snapshots-updated]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked project requirements
        run: pip install -r requirements-dev.txt
      - name: Rebuild official derived Jarvis graph at existing snapshot timestamp
        run: python -m scripts.refresh_scentai_jarvis_state --write --generated-at '2026-10-04T12:55:34+00:00'
      - name: Commit only approved derived status files on this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add examples/retail/data/scentai_merchant_mapping_work_queue.json
          git add examples/retail/data/scentai_affiliate_activation_status.json
          git add examples/retail/data/scentai_image_approval_work_queue.json
          git add examples/retail/data/scentai_release_01_feed_activation_queue.json
          git add examples/retail/data/scentai_release_01_gate_status.json
          git add examples/retail/data/scentai_release_pipeline_status.json
          git add examples/retail/data/scentai_jarvis_operations_status.json
          git add examples/retail/data/scentai_content_operations_status.json
          git add examples/retail/data/scentai_content_operations_status_batch02.json
          git add examples/retail/data/scentai_content_operations_status_batch03.json
          git add examples/retail/data/scentai_content_pipeline_status.json
          git add examples/retail/data/scentai_media_generation_queue.json
          git add examples/retail/data/scentai_jarvis_master_status.json
          if git diff --cached --quiet; then
            echo "No derived-state changes"
            exit 0
          fi
          git config user.name "DUFYND Snapshot Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "[snapshots-updated] Regenerate exact Jarvis status graph for approved image gates"
          git push origin HEAD:refs/heads/dufynd-reconcile-approved-image-gates-20261008
