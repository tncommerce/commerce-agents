name: DUFYND Naxos 3D Pilot Bridge

on:
  push:
    branches:
      - dufynd-visual-audit-20260924

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch temporary 3D pilot artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p naxos-3d
          curl --fail --location --silent --show-error 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/86d8022d-cb70-4e1d-a556-46128c41e4a8/revisions/00000001-naxos-build-v1/artifacts/8d167650eee16502a8cec7bae2389cc3.png?X-Amz-Expires=900&X-Amz-Date=20260924T075537Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260924%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=139c3e3e1e9a7f2463dfbe3b7d8acc89e1ee57071bb8e568f7e62a649618e004' -o naxos-3d/naxos-3d-pilot.png
          curl --fail --location --silent --show-error 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/86d8022d-cb70-4e1d-a556-46128c41e4a8/revisions/00000001-naxos-build-v1/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260924T075537Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260924%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=e700ab69f1563691e38c333d97aff4bf415db0c7d3dbe65196508bd6f24a8b0f' -o naxos-3d/naxos-3d-pilot.glb
          test -s naxos-3d/naxos-3d-pilot.png
          test -s naxos-3d/naxos-3d-pilot.glb
          file naxos-3d/*

      - name: Upload Naxos 3D pilot
        uses: actions/upload-artifact@v4
        with:
          name: dufynd-naxos-3d-pilot
          path: naxos-3d/
          if-no-files-found: error
          retention-days: 1
